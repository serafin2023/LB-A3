<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTR · La Bragadense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --teal:#005457;
    --teal-ink:#013638;
    --green:#A4CC39;
    --green-ink:#4C6B17;
    --bg:#F3F5F1;
    --surface:#FFFFFF;
    --ink:#10231F;
    --muted:#5B6B63;
    --border:#DFE4DC;
    --gain:#3C7A3E;
    --gain-bg:#EAF3E4;
    --loss:#A6432E;
    --loss-bg:#FBEBE7;
    --radius:8px;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
  }
  ::selection{background:var(--green);color:var(--teal-ink);}
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex:none;background:var(--teal);color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:16px;}
  .brand-dot{width:26px;height:26px;border-radius:50%;background:var(--green);flex:none;position:relative;}
  .brand-dot::after{content:"";position:absolute;inset:6px;border:2px solid var(--teal);border-radius:50%;}
  .brand-name{font-weight:700;font-size:14.5px;letter-spacing:.2px;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:rgba(255,255,255,.65);margin-top:1px;}
  .navbtn{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:transparent;border:none;color:rgba(255,255,255,.78);
    font-family:inherit;font-size:13.5px;font-weight:500;
    padding:10px 12px;border-radius:6px;cursor:pointer;transition:background .12s;
  }
  .navbtn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .navbtn.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--green);}
  .navbtn svg{width:16px;height:16px;flex:none;}
  .sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.15);padding-top:14px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--teal-ink);}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .content{padding:24px 28px 60px;max-width:1360px;width:100%;margin:0;}

  .btn{
    font-family:inherit;font-size:13px;font-weight:600;border-radius:6px;border:1px solid transparent;
    padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .12s,background .12s;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--green);color:var(--teal-ink);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;color:var(--teal-ink);border-color:var(--border);}
  .btn-ghost:hover{background:#EEF2ED;}
  .btn-danger{background:transparent;color:var(--loss);border-color:var(--loss);}
  .btn-danger:hover{background:var(--loss-bg);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-head h2{font-size:14.5px;margin:0;font-weight:700;color:var(--teal-ink);}
  .card-head .hint{font-size:11.5px;color:var(--muted);}
  .card-body{padding:16px 18px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal);}
  .kpi.gain .accent{background:var(--gain);}
  .kpi.loss .accent{background:var(--loss);}
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:600;}
  .kpi-value{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--teal-ink);}
  .kpi-value.gain{color:var(--gain);}
  .kpi-value.loss{color:var(--loss);}
  .kpi-note{font-size:11.5px;color:var(--muted);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;font-size:11px;text-transform:none;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:#F7F9F6;}
  .num{text-align:right;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-acopio{background:#E4EEEF;color:var(--teal-ink);}
  .tag-siembras{background:#EFF5DD;color:var(--green-ink);}
  .tag-fut{background:#EFF1EE;color:var(--muted);}
  .tag-op{background:#F3ECE0;color:#8A5A20;}
  .pill-compra{color:var(--gain);font-weight:700;}
  .pill-venta{color:var(--loss);font-weight:700;}
  .val-gain{color:var(--gain);font-weight:700;}
  .val-loss{color:var(--loss);font-weight:700;}
  .val-na{color:var(--muted);font-style:italic;font-weight:400;}
  .row-closed{opacity:.5;}
  .row-closed td{text-decoration:line-through;text-decoration-color:var(--muted);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  select,input[type=text],input[type=number],input[type=date]{
    font-family:inherit;font-size:12.8px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);
  }
  select:focus,input:focus{outline:2px solid var(--green);outline-offset:1px;}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;}

  .table-scroll{overflow-x:auto;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty h3{color:var(--teal-ink);margin-bottom:6px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(16,35,31,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100;}
  .modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:22px 24px;}
  .modal h3{margin:0 0 4px;color:var(--teal-ink);font-size:16px;}
  .modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--teal-ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:200;max-width:360px;}
  .toast.err{background:var(--loss);}

  .badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
  .dropzone{border:1.5px dashed var(--border);border-radius:8px;padding:22px;text-align:center;color:var(--muted);font-size:12.8px;cursor:pointer;transition:border-color .15s,background .15s;}
  .dropzone:hover,.dropzone.drag{border-color:var(--teal);background:#F1F6F5;}
  .dropzone input{display:none;}
  .source-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:#EFF3EC;border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:960px){
    .sidebar{width:64px;padding:16px 8px;}
    .brand-name,.brand-sub,.navbtn span{display:none;}
    .navbtn{justify-content:center;}
    .grid-2{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
  .link-btn{background:none;border:none;color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;}
  .icon-btn:hover{background:#EEF2ED;color:var(--loss);}
  .small-muted{font-size:11.5px;color:var(--muted);}
</style>
</head>

========================================================================= */
async function loadState(){
  let usedStoredPositions = false;
  try{
    const p = await storageAdapter.get(STORAGE_KEY_POSITIONS).catch(()=>null);
    STATE.positions = p ? JSON.parse(p.value) : SEED_POSITIONS.slice();
    usedStoredPositions = !!p;
  }catch(e){ STATE.positions = SEED_POSITIONS.slice(); }
  try{
    const pm = await storageAdapter.get(STORAGE_KEY_PRICES).catch(()=>null);
    STATE.priceMap = pm ? JSON.parse(pm.value) : {...SEED_PRICES};
  }catch(e){ STATE.priceMap = {...SEED_PRICES}; }
  try{
    const pmeta = await storageAdapter.get(STORAGE_KEY_PRICEMETA).catch(()=>null);
    STATE.priceMeta = pmeta ? JSON.parse(pmeta.value) : {...SEED_META};
  }catch(e){ STATE.priceMeta = {...SEED_META}; }
  try{
    const sc = await storageAdapter.get(STORAGE_KEY_SCENARIOS).catch(()=>null);
    STATE.scenarioPrices = sc ? JSON.parse(sc.value) : {};
  }catch(e){ STATE.scenarioPrices = {}; }
  try{
    const rf = await storageAdapter.get(STORAGE_KEY_REFERENCIAS).catch(()=>null);
    STATE.referencias = rf ? JSON.parse(rf.value) : {...SEED_REFERENCIAS};
  }catch(e){ STATE.referencias = {...SEED_REFERENCIAS}; }

  // ¿Los datos guardados en este navegador vienen de una versión anterior de la app?
  let storedVersion = null;
  try{ storedVersion = (await storageAdapter.get(STORAGE_KEY_SEED_VERSION).catch(()=>null))?.value || null; }catch(e){ storedVersion = null; }
  if(!usedStoredPositions){
    // Primera vez en este navegador: quedamos al día automáticamente.
    try{ await storageAdapter.set(STORAGE_KEY_SEED_VERSION, SEED_VERSION); }catch(e){}
    STATE.seedOutdated = false;
  } else {
    STATE.seedOutdated = storedVersion !== SEED_VERSION;
  }

  STATE.loaded = true;
}
async function savePositions(){
  try{ await storageAdapter.set(STORAGE_KEY_POSITIONS, JSON.stringify(STATE.positions)); }
  catch(e){ toast('No se pudo guardar (posiciones).','err'); }

async function savePrices(){
  try{
    await storageAdapter.set(STORAGE_KEY_PRICES, JSON.stringify(STATE.priceMap));

}

  catch(e){ /* silencioso */ }
}

function uid(){ return 'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function fmtMoney(n, dec=2){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtTns(n){ return (n||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function fmtUSD(n, withSign=true){
  if(n===null||n===undefined||isNaN(n)) return '<span class="val-na">s/d</span>';
  const cls = n>0?'val-gain':(n<0?'val-loss':'');
  const sign = withSign && n>0 ? '+' : '';
  return `<span class="${cls}">${sign}${fmtMoney(n,0)}</span>`;
}
function granoCode(g){ return (g||'').trim().toUpperCase().slice(0,3); }
function vtoToDate(v){
  // v esperado "YYYY-MM"
  if(!v) return null;
  const [y,m] = v.split('-').map(Number);
  return {y, m};
}
function mesAbbr(m){ return MESES[(m-1+12)%12]; }
function buildFutTicker(grano, vto){
  const d = vtoToDate(vto); if(!d) return null;
  const yy = String(d.y).slice(-2);
  return `${granoCode(grano)}.ROS/${mesAbbr(d.m)}${yy}`;
}
function buildOptTicker(grano, vto, strike, tipo){
  const d = vtoToDate(vto); if(!d) return null;
  const yy = String(d.y).slice(-2);
  const letra = (tipo||'').trim().charAt(0).toUpperCase();
  const strikeStr = (Number(strike)%1===0) ? String(Number(strike)) : String(strike);
  return `${granoCode(grano)}.ROS/${mesAbbr(d.m)}${yy} ${strikeStr} ${letra}`;
}
function tickerFor(pos){
  return pos.instrumento==='Futuro'
    ? buildFutTicker(pos.grano, pos.vencimiento)
    : buildOptTicker(pos.grano, pos.vencimiento, pos.strike, pos.tipoOpcion);
}
function marketPriceFor(pos){
  const t = tickerFor(pos);
  if(!t) return null;
  const hit = STATE.priceMap[t.toUpperCase()];
  return hit ? hit.ajuste : null;
}
function usedPriceFor(pos){
  if(pos.estado==='Cerrada'){
    return (pos.precioCierreOperacion!==null && pos.precioCierreOperacion!==undefined) ? pos.precioCierreOperacion : null;
  }
  if(pos.cierreManual!==null && pos.cierreManual!==undefined && pos.cierreManual!=='') return Number(pos.cierreManual);
  return marketPriceFor(pos);
}
function diffUnitFor(pos, precio){
  if(precio===null || precio===undefined || isNaN(precio)) return null;
  const ap = Number(pos.apertura);
  return pos.operacion==='Venta' ? (ap - precio) : (precio - ap);
}
function enrich(pos){
  const precio = usedPriceFor(pos);
  const diffU = diffUnitFor(pos, precio);
  const total = diffU===null ? null : diffU*Number(pos.toneladas||0);
  return {...pos, ticker:tickerFor(pos), precioUsado:precio, diffUnit:diffU, totalUSD:total,
           precioEsManual: pos.estado!=='Cerrada' && pos.cierreManual!==null && pos.cierreManual!==undefined && pos.cierreManual!=='' };
}
function toast(msg, type=''){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* =========================================================================
   IMPORTACION DE EXCEL / CSV
========================================================================= */
function gridFromSheet(ws){
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}
function cellText(v){ return (typeof v==='string') ? v.trim() : v; }

function findAnchors(grid){
  // busca celdas 'Futuros'/'Opciones'/'Estrategias' con vecino izquierdo 'Acopio'/'Siembras'
  const anchors = [];
  for(let r=0;r<grid.length;r++){
    const row = grid[r]||[];
    for(let c=1;c<row.length;c++){
      const v = cellText(row[c]);
      if(typeof v==='string' && ['Futuros','Opciones','Estrategias'].includes(v)){
        const left = cellText(row[c-1]);
        if(left==='Acopio' || left==='Siembras'){
          anchors.push({row:r, col:c, cartera:left, tipoTabla:v});
        }
      }
    }
  }
  anchors.sort((a,b)=>a.row-b.row);
  return anchors;
}

function excelDateToVto(v){
  if(v && typeof v==='object' && typeof v.getFullYear==='function'){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
  }
  if(typeof v==='number'){ // fecha serial excel
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}`;
  }
  return null;
}

function parseLegBlock(grid, anchor, nextAnchorRow, cartera){
  const headerRow = grid[anchor.row+1] || [];
  // localizar columnas por texto de encabezado, buscando desde anchor.col-1 hasta +9
  const colMap = {};
  for(let c=Math.max(0,anchor.col-1); c<anchor.col+10; c++){
    const h = cellText(headerRow[c]);
    if(typeof h!=='string') continue;
    const hl = h.toLowerCase();
    if(hl==='grano') colMap.grano=c;
    else if(hl==='op') colMap.op=c;
    else if(hl==='tipo') colMap.tipo=c;
    else if(hl.startsWith('posic')) colMap.vto=c;
    else if(hl==='strike') colMap.strike=c;
    else if(hl==='tns') colMap.tns=c;
    else if(hl.startsWith('$ prom apert') || hl.startsWith('$ apert')) colMap.apertura=c;
  }
  if(colMap.grano===undefined || colMap.op===undefined) return {legs:[], legend:{}};
  const labelCol = anchor.col-1;
  const dataStart = anchor.row+2;
  const hardLimit = nextAnchorRow!==null ? nextAnchorRow-1 : Math.min(grid.length, anchor.row+40);
  const legs = [];
  const legend = {}; // "2)" -> descripción tomada del pie de la hoja
  let blankStreak = 0;
  let currentGroupLabel = null;
  let currentGroupId = null;
  let groupCounter = 0;
  let inGroup = false; // seguimos dentro del mismo grupo mientras no haya un corte en blanco
  const isEstrategia = anchor.tipoTabla==='Estrategias';
  for(let r=dataStart; r<=hardLimit && r<grid.length; r++){
    const row = grid[r]||[];
    const opVal = cellText(row[colMap.op]);
    const granoVal = cellText(row[colMap.grano]);
    const labelVal = cellText(row[labelCol]);
    const validOp = (typeof opVal==='string') && ['compra','venta'].includes(opVal.trim().toLowerCase());
    if(!validOp || !granoVal){
      // ¿es una fila de referencia/leyenda al pie (número + texto descriptivo, sin operación)?
      if(labelVal && typeof granoVal==='string' && granoVal.trim().length>8){
        const key = labelVal.toString().trim();
        legend[key] = legend[key] ? `${legend[key]} / ${granoVal.trim()}` : granoVal.trim();
        blankStreak = 0;
        continue;
      }
      inGroup = false;
      blankStreak++;
      if(blankStreak>=6) break;
      continue;
    }
    blankStreak = 0;
    if(labelVal){
      currentGroupLabel = String(labelVal).trim();
      groupCounter++;
      currentGroupId = uid();
      inGroup = true;
    } else if(!inGroup){
      currentGroupLabel = null;
      groupCounter++;
      currentGroupId = uid();
      inGroup = true;
    }
    const tipoVal = colMap.tipo!==undefined ? cellText(row[colMap.tipo]) : null;
    const isFut = !tipoVal || tipoVal.toString().toLowerCase().startsWith('fut');
    const vtoRaw = row[colMap.vto];
    const vto = excelDateToVto(vtoRaw);
    const strike = colMap.strike!==undefined ? (Number(row[colMap.strike])||0) : 0;
    const tns = Number(row[colMap.tns])||0;
    const apertura = Number(row[colMap.apertura])||0;
    if(!vto || !tns) continue;
    legs.push({
      id: uid(),
      cartera: cartera,
      instrumento: isFut ? 'Futuro' : 'Opcion',
      grano: granoVal.toString().trim(),
      operacion: opVal.trim().charAt(0).toUpperCase()+opVal.trim().slice(1).toLowerCase(),
      vencimiento: vto,
      tipoOpcion: isFut ? '' : (tipoVal||'').toString().trim(),
      strike: isFut ? 0 : strike,
      toneladas: tns,
      apertura: apertura,
      estrategia: isEstrategia ? (currentGroupLabel || `Estrategia ${groupCounter}`) : '',
      estrategiaId: isEstrategia ? currentGroupId : null,
      referencia: (labelVal!==null && labelVal!==undefined && labelVal!=='') ? String(labelVal).trim() : '',
      notas:'',
      estado:'Abierta',
      origen:'importado',
      fechaAlta: new Date().toISOString().slice(0,10),
      cierreManual: null,
      fechaCierre: null,
      precioCierreOperacion: null,
    });
  }
  return {legs, legend};
}

function parsePosiSeparada(ws){
  const grid = gridFromSheet(ws);
  const anchors = findAnchors(grid);
  let legs = [];
  const legendByCartera = {};
  anchors.forEach((a)=>{
    // Acopio y Siembras suelen correr en paralelo (columnas distintas) por el mismo rango de filas.
    // Solo debe acotar el bloque otra ancla del MISMO lado (columna cercana), no la del lado opuesto.
    const sameSide = x => (x.col<20) === (a.col<20);
    const laterRows = anchors.filter(x=>x.row>a.row && sameSide(x)).map(x=>x.row);
    const next = laterRows.length ? Math.min(...laterRows) : null;
    const {legs:blockLegs, legend} = parseLegBlock(grid, a, next, a.cartera);
    legendByCartera[a.cartera] = {...(legendByCartera[a.cartera]||{}), ...legend};
    legs = legs.concat(blockLegs);
  });
  // Completar el nombre de la estrategia con la descripción del pie de hoja, cuando exista
  legs = legs.map(l=>{
    if(!l.estrategia) return l;
    const leyenda = (legendByCartera[l.cartera]||{})[l.estrategia];
    return leyenda ? {...l, estrategia: `${l.estrategia} ${leyenda}`} : l;
  });
  return {legs, legendByCartera};
}

function parseBaseSheetGeneric(ws){
  const grid = gridFromSheet(ws);
  if(!grid.length) return {};
  const header = grid[0].map(h=> (typeof h==='string'? h.trim().toUpperCase() : h));
  let colTicker = header.findIndex(h=> typeof h==='string' && (h.includes('TIPO CONTRATO') || h.includes('SIMBOLO') || h.includes('TICKER')));
  let colAjuste = header.findIndex(h=> typeof h==='string' && h.includes('AJUSTE'));
  if(colAjuste===-1) colAjuste = header.findIndex(h=> typeof h==='string' && (h.includes('CIERRE') || h==='ULTIMO'));
  if(colTicker===-1 || colAjuste===-1) return {};
  const map = {};
  for(let r=1;r<grid.length;r++){
    const row = grid[r]||[];
    const t = cellText(row[colTicker]);
    const a = row[colAjuste];
    if(typeof t==='string' && t.trim() && typeof a==='number'){
      map[t.trim().toUpperCase()] = {ajuste:a, fuente:'archivo'};
    }
  }
  return map;
}

function handleWorkbook(wb, fileName){
  let importedLegs = [];
  let importedPrices = {};
  let importedReferencias = null;
  let foundPosiciones = false, foundPrecios = false;

  const posiSheetName = wb.SheetNames.find(n=> n.toLowerCase().includes('posi'));
  if(posiSheetName){
    const resultado = parsePosiSeparada(wb.Sheets[posiSheetName]);
    importedLegs = resultado.legs;
    importedReferencias = resultado.legendByCartera;
    foundPosiciones = importedLegs.length>0;
  }
  wb.SheetNames.forEach(name=>{
    const nl = name.toLowerCase();
    if(nl.includes('base futuro') || nl.includes('base opcion') || nl.includes('futuros') || nl.includes('opciones')){
      const m = parseBaseSheetGeneric(wb.Sheets[name]);
      if(Object.keys(m).length){ importedPrices = {...importedPrices, ...m}; foundPrecios = true; }
    }
  });

  if(foundPrecios){
    STATE.priceMap = {...STATE.priceMap, ...importedPrices};
    STATE.priceMeta = {fecha: new Date().toISOString().slice(0,10), fuente: fileName};
    savePrices();
  }
  if(foundPosiciones){
    // Evita duplicados: una nueva importación reemplaza las posiciones abiertas
    // que vinieron de una importación anterior. No toca las cargadas a mano
    // ni las que ya se marcaron como cerradas (quedan como historial).
    const conservar = STATE.positions.filter(p => p.origen==='manual' || p.estado==='Cerrada');
    STATE.positions = conservar.concat(importedLegs.map(l=>({...l, origen:'importado'})));
    savePositions();
    if(importedReferencias){
      STATE.referencias = importedReferencias;
      saveReferencias();
    }
  }
  return {legs: importedLegs.length, prices: Object.keys(importedPrices).length, foundPosiciones, foundPrecios};
}

function parseNumEs(str){
  // Los exports de Rofex/MATba usan coma como separador decimal (ej: "215,700000").
  // parseFloat нативо corta en la coma y trunca el número — por eso lo convertimos primero.
  if(typeof str==='number') return str;
  if(typeof str!=='string') return NaN;
  const limpio = str.trim().replace(/\./g,'').replace(',', '.');
  return parseFloat(limpio);
}
function handleCsvPrices(parsedRows, fileName){
  if(!parsedRows.length) return {prices:0};
  const original = Object.keys(parsedRows[0]);
  let tickerKey = original.find(k=> k.trim().toUpperCase().includes('TIPO CONTRATO') || k.trim().toUpperCase().includes('SIMBOLO') || k.trim().toUpperCase().includes('TICKER'));
  let ajusteKey = original.find(k=> k.trim().toUpperCase().includes('AJUSTE'));
  if(!ajusteKey) ajusteKey = original.find(k=> k.trim().toUpperCase().includes('CIERRE') || k.trim().toUpperCase()==='ULTIMO');
  if(!tickerKey || !ajusteKey) return {prices:0, error:true};
  const map = {};
  parsedRows.forEach(row=>{
    const t = row[tickerKey];
    const a = parseNumEs(row[ajusteKey]);
    if(t && !isNaN(a)) map[String(t).trim().toUpperCase()] = {ajuste:a, fuente:'csv'};
  });
  STATE.priceMap = {...STATE.priceMap, ...map};
  STATE.priceMeta = {fecha:new Date().toISOString().slice(0,10), fuente:fileName};
  savePrices();
  return {prices:Object.keys(map).length};
}

function processFile(file){
  return new Promise((resolve)=>{
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        if(name.endsWith('.csv')){
          Papa.parse(new TextDecoder('utf-8').decode(e.target.result), {
            header:true, skipEmptyLines:true,
            complete: (res)=>{
              const r = handleCsvPrices(res.data, file.name);
              resolve({file:file.name, ...r});
            }
          });
        } else {
          const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
          const r = handleWorkbook(wb, file.name);
          resolve({file:file.name, ...r});
        }
      }catch(err){
        console.error(err);
        resolve({file:file.name, error:true, mensaje:err.message});
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

async function processFiles(fileList){
  const files = Array.from(fileList);
  if(!files.length) return;
  const resultados = [];
  for(const file of files){
    resultados.push(await processFile(file));
  }
  let totalPosiciones = 0, totalPrecios = 0;
  const errores = [];
  resultados.forEach(r=>{
    if(r.error){ errores.push(`${r.file}: ${r.mensaje || 'no se reconoció la estructura'}`); return; }
    const esCsv = r.file.toLowerCase().endsWith('.csv');
    if(esCsv){
      if(r.prices) totalPrecios += r.prices;
      else errores.push(`${r.file}: no se encontraron columnas de precio/ticker reconocibles.`);
    } else {
      if(r.foundPosiciones) totalPosiciones += r.legs;
      if(r.foundPrecios) totalPrecios += r.prices;
      if(!r.foundPosiciones && !r.foundPrecios) errores.push(`${r.file}: no se reconoció la estructura (¿es el MTR original?).`);
    }
  });
  const msgs = [];
  if(totalPosiciones) msgs.push(`${totalPosiciones} posiciones importadas`);
  if(totalPrecios) msgs.push(`${totalPrecios} contratos de precio actualizados (${files.length} archivo${files.length>1?'s':''})`);
  if(msgs.length) toast(msgs.join(' · ')+'.');
  if(errores.length) toast(errores.join(' | '),'err');
  render();
}

function resumenEstrategiaGroups(legs){
  const byId = {};
  legs.forEach(p=>{ const k = p.estrategiaId || p.id; (byId[k]=byId[k]||[]).push(p); });
  // Ordenar los grupos por el nombre visible de cada uno, para que la lista sea estable
  const grupos = Object.entries(byId).sort((a,b)=> (a[1][0].estrategia||'').localeCompare(b[1][0].estrategia||''));
  return grupos.map(([estrategiaId,ls])=>{
    const name = ls[0].estrategia || '(sin nombre)';
    const diag = diagnosticarEstrategia(ls, p=>p, false); // ls ya viene enriquecido con precios reales de cierre

const MESES_FILTRO = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const MESES_FILTRO_LABEL = {'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};

function aniosPresentes(){
  const s = new Set(STATE.positions.filter(p=>p.vencimiento).map(p=>p.vencimiento.split('-')[0]));
  return Array.from(s).sort();
}
function mesesPresentes(){
  const s = new Set(STATE.positions.filter(p=>p.vencimiento).map(p=>p.vencimiento.split('-')[1]));
  return MESES_FILTRO.filter(m=>s.has(m));
}
function granosPresentesResumen(){
  const base = ['Soja','Maiz','Trigo'];
  const extra = Array.from(new Set(STATE.positions.map(p=>p.grano))).filter(g=>!base.includes(g));
  return [...base, ...extra.sort()];
}
function coincideInstrumento(p, valor){
  if(valor==='Todos') return true;
  if(valor==='Futuro') return p.instrumento==='Futuro';
  if(valor==='Call') return p.instrumento==='Opcion' && p.tipoOpcion==='Call';
  if(valor==='Put') return p.instrumento==='Opcion' && p.tipoOpcion==='Put';
  return true;
}
function pasaFiltrosResumen(p){
  const f = STATE.ui.resumenFiltros;
  if(f.cartera!=='Todas' && p.cartera!==f.cartera) return false;
  if(f.grano!=='Todos' && p.grano!==f.grano) return false;
  if(!coincideInstrumento(p, f.instrumento)) return false;
  if(f.operacion!=='Todas' && p.operacion!==f.operacion) return false;
  if(f.mes!=='Todos' && (p.vencimiento||'').split('-')[1]!==f.mes) return false;
  if(f.anio!=='Todos' && (p.vencimiento||'').split('-')[0]!==f.anio) return false;
  if(f.precio){
    const buscado = f.precio.trim();
    const strikeStr = p.strike ? String(p.strike) : '';
    const aperturaStr = String(p.apertura);
    if(!strikeStr.includes(buscado) && !aperturaStr.includes(buscado)) return false;
  }
  return true;
}

function posicionNetaBadgesHTML(positions){
  const granosBase = ['Soja','Maiz','Trigo'];
  const extra = Array.from(new Set(positions.map(p=>p.grano))).filter(g=>g && !granosBase.includes(g)).sort();
  const granos = [...granosBase, ...extra];
  const nets = {};
  positions.forEach(p=>{
    const signo = p.operacion==='Compra' ? 1 : -1;
    nets[p.grano] = (nets[p.grano]||0) + signo*Number(p.toneladas||0);
  });
  return `
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
    ${granos.map(g=>{
      const val = nets[g]||0;
      const comprado = val>0, vendido = val<0;
      const bg = comprado?'var(--gain-bg)':(vendido?'var(--loss-bg)':'#EEF1EE');
      const color = comprado?'var(--gain)':(vendido?'var(--loss)':'var(--muted)');
      const etiqueta = comprado?'Comprado':(vendido?'Vendido':'Neutro');
      return `<div style="background:${bg};border-radius:8px;padding:10px 16px;min-width:150px;flex:1;max-width:220px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;">${g.toUpperCase()}</div>
        <div style="font-size:16px;font-weight:800;color:${color};margin-top:2px;">${etiqueta}${val!==0?` · ${fmtTns(Math.abs(val))} tn`:''}</div>
      </div>`;
    }).join('')}
  </div>`;
}

  const acopioCard = `

  return `

    ${mostrarAcopio? acopioCard : ''}

  ${referenciasGlosarioHTML()}`;
}
function referenciasGlosarioHTML(){
  const ref = STATE.referencias || {};
  const filas = [];
  ['Acopio','Siembras'].forEach(cartera=>{

  if(!filas.length) return '';
  filas.sort((a,b)=> a.cartera.localeCompare(b.cartera) || a.numero.localeCompare(b.numero, undefined, {numeric:true}));
  const abierto = STATE.ui.diagnosticosAbiertos.has('__glosario__');
  return `

    <div class="card-body">
      <button onclick="toggleDiagnostico('__glosario__')" style="background:none;border:none;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal-ink);">

        <h3 style="font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;">Posiciones sueltas cerradas</h3>
        ${historialTable(siembrasSueltas)}
        <h3 style="font-size:13px;color:var(--muted);margin:20px 0 8px;font-weight:700;">Estrategias cerradas</h3>
        ${siembrasEstrategias.length? historialEstrategiaGroups(siembrasEstrategias) : '<div class="small-muted">Sin estrategias cerradas.</div>'}
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   RENDER: Escenarios
========================================================================= */
function scenarioValueFor(p, precio, aplica){
  if(precio===null || precio===undefined || precio==='' || isNaN(Number(precio))) return {valor:null, total:null};
  let valorPosicion;
  if(p.instrumento==='Opcion' || !aplica){
    // Las opciones siempre quedan congeladas en su precio de apertura.
    // Los futuros que no coinciden con Operación/Mes/Año elegidos también quedan congelados (impacto $0),
    // porque no son el contrato que se quiere evaluar en este escenario.
    valorPosicion = Number(p.apertura);
  } else {
    valorPosicion = Number(precio);
  }
  const diffUnit = p.operacion==='Venta' ? (Number(p.apertura)-valorPosicion) : (valorPosicion-Number(p.apertura));
  const total = diffUnit*Number(p.toneladas||0);
  return {valor:valorPosicion, total};
}
function pasaFiltrosEscenario(p){
  // Cartera, Grano e Instrumento sí ocultan filas: acotan "dónde estoy mirando".
  const f = STATE.ui.escenarioFiltros;
  if(f.cartera!=='Todas' && p.cartera!==f.cartera) return false;
  if(f.grano!=='Todos' && p.grano!==f.grano) return false;
  if(!coincideInstrumento(p, f.instrumento)) return false;
  return true;
}
function aplicaEscenarioA(p){
  // Operación / Mes / Año NO ocultan filas: solo definen a cuáles se les aplica el precio del escenario.
  const f = STATE.ui.escenarioFiltros;
  if(f.operacion!=='Todas' && p.operacion!==f.operacion) return false;
  if(f.mes!=='Todos' && (p.vencimiento||'').split('-')[1]!==f.mes) return false;
  if(f.anio!=='Todos' && (p.vencimiento||'').split('-')[0]!==f.anio) return false;
  return true;
}
function escenarioTable(legs, precio){
  if(!legs.length) return `<div class="small-muted" style="padding:10px 2px;">Sin posiciones.</div>`;
  return `
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Ref.</th><th>Grano</th><th>Instr.</th><th>Op</th><th>Vto</th>
        <th class="num">Strike</th><th class="num">Tns</th><th class="num">$ Apert.</th><th class="num">$ Escenario</th><th class="num">Result.</th><th></th>
      </tr></thead>
      <tbody>
        ${legs.map(p=>{
          const aplica = aplicaEscenarioA(p);
          const sc = scenarioValueFor(p, precio, aplica);
          const congelada = precio!=='' && precio!==null && precio!==undefined && !isNaN(Number(precio)) && (p.instrumento==='Opcion' || !aplica);
          return `<tr ${congelada?'style="opacity:.55;"':''}>
            <td class="small-muted">${p.referencia||'—'}</td>
            <td>${p.grano}</td>
            <td><span class="tag ${p.instrumento==='Futuro'?'tag-fut':'tag-op'}">${p.instrumento==='Futuro'?'Futuro':p.tipoOpcion}</span></td>
            <td class="${p.operacion==='Compra'?'pill-compra':'pill-venta'}">${p.operacion}</td>

            <td class="num">${fmtTns(p.toneladas)}</td>

            <td class="num">${sc.valor!==null?fmtMoney(sc.valor,1):'<span class="val-na">s/d</span>'}${congelada?' <span class="small-muted">(sin cambio)</span>':''}</td>
            <td class="num">${fmtUSD(sc.total)}</td>
            <td style="white-space:nowrap;">
              <button class="icon-btn" title="Editar" onclick="openEdit('${p.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn" title="Eliminar" onclick="deletePosition('${p.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a1 1 0 01-1 1H9a1 1 0 01-1-1V6"/></svg>
              </button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>

  </div>`;
}
/* ---- Motor de diagnóstico de estrategias (Put Sintético / Piso y Techo / Pase) ---- */
function diagnosticarEstrategia(legsCrudas, valuar, esEscenario){
  valuar = valuar || enrich;
  const enr = legsCrudas.map(valuar);
  const futuros = enr.filter(l=>l.instrumento==='Futuro');
  const calls = enr.filter(l=>l.instrumento==='Opcion' && l.tipoOpcion==='Call');
  const puts = enr.filter(l=>l.instrumento==='Opcion' && l.tipoOpcion==='Put');
  const totalReal = enr.reduce((a,p)=>a+(p.totalUSD||0),0);

  // PASE ENTRE POSICIONES: 2 futuros, distinto mes, direcciones opuestas, sin opciones
  if(futuros.length===2 && calls.length===0 && puts.length===0){
    const [x,y] = futuros;
    if(x.vencimiento!==y.vencimiento && x.operacion!==y.operacion){
      const cercano = x.vencimiento < y.vencimiento ? x : y;
      const lejano  = x.vencimiento < y.vencimiento ? y : x;
      const sEntrada = lejano.apertura - cercano.apertura;
      const sCierre = (lejano.precioUsado!==null && cercano.precioUsado!==null) ? (lejano.precioUsado - cercano.precioUsado) : null;
      const [ay,am] = cercano.vencimiento.split('-').map(Number);
      const [by,bm] = lejano.vencimiento.split('-').map(Number);
      const diasDif = Math.max(1, Math.round((new Date(by,bm-1,1) - new Date(ay,am-1,1))/86400000));
      const tna = sCierre!==null && cercano.precioUsado ? (sCierre/cercano.precioUsado)*(365/diasDif)*100 : null;
      const ganaSiAchica = lejano.operacion==='Venta'; // vendido el lejano + comprado el cercano => gana si el pase se achica
      let texto;
      if(sCierre===null){
        texto = `Todavía falta el precio${esEscenario?' de escenario':' de cierre'} de alguno de los dos meses para poder calcular el pase.`;
      } else {
        const seAchico = sCierre < sEntrada;
        const favorable = (ganaSiAchica && seAchico) || (!ganaSiAchica && !seAchico);
        texto = `${lejano.grano}: pase entre ${cercano.vencimiento} (cercano) y ${lejano.vencimiento} (lejano). `
              + `Diferencia al armarlo: ${fmtMoney(sEntrada,2)} u$s/tn. Diferencia ${esEscenario?'en este escenario':'al cierre de hoy'}: ${fmtMoney(sCierre,2)} u$s/tn (se ${seAchico?'achicó':'ensanchó'}). `
              + `Tu posición está ${ganaSiAchica?'vendida en el mes lejano y comprada en el cercano':'comprada en el mes lejano y vendida en el cercano'}, `
              + `así que ganás si el pase se ${ganaSiAchica?'achica':'ensancha'}. ${esEscenario?'En este escenario estarías':'Hoy estás'} ${favorable?'a favor':'en contra'} de ese movimiento.`
              + (tna!==null? ` Tasa implícita del pase: ${fmtMoney(tna,1)}% TNA.` : '');
      }
      return {tipo:'Pase entre posiciones', texto, totalReal, esEscenario};
    }
  }

  // PISO Y TECHO (COLLAR): Put comprado + Call vendido
  const putCompra = puts.filter(l=>l.operacion==='Compra');
  const callVenta = calls.filter(l=>l.operacion==='Venta');
  if(putCompra.length && callVenta.length){
    const put = putCompra[0], call = callVenta[0];
    const primaNeta = Number(put.apertura) - Number(call.apertura);
    const piso = Number(put.strike) - primaNeta;
    const techo = Number(call.strike) - primaNeta;
    const futuroRef = futuros.find(f=>f.vencimiento===put.vencimiento) || futuros[0];
    const precioMercado = futuroRef ? futuroRef.precioUsado : (esEscenario ? null : marketPriceFor({...put, instrumento:'Futuro', strike:0, tipoOpcion:''}));
    let texto;
    if(precioMercado===null || precioMercado===undefined){
      texto = `Piso fijo: ${fmtMoney(piso,2)} u$s/tn. Techo fijo: ${fmtMoney(techo,2)} u$s/tn. (Todavía no hay precio${esEscenario?' de escenario':' de cierre'} del futuro de referencia para saber en qué tramo estás.)`;
    } else if(precioMercado < Number(put.strike)){
      texto = `El mercado ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, por debajo de tu Put (strike ${fmtMoney(put.strike,0)}): estás protegido en el piso. Resultado fijo aproximado: ${fmtMoney(piso,2)} u$s/tn.`;
    } else if(precioMercado > Number(call.strike)){
      texto = `El mercado ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, por encima de tu Call vendido (strike ${fmtMoney(call.strike,0)}): tu resultado quedó topado en el techo. Resultado fijo aproximado: ${fmtMoney(techo,2)} u$s/tn.`;
    } else {
      texto = `El mercado ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, entre tu Put (${fmtMoney(put.strike,0)}) y tu Call (${fmtMoney(call.strike,0)}): tu resultado se mueve libremente con el precio, dentro del rango piso ${fmtMoney(piso,2)} / techo ${fmtMoney(techo,2)} u$s/tn.`;
    }
    return {tipo:'Piso y Techo (Collar)', texto, totalReal, esEscenario};
  }

  // PUT SINTÉTICO: Futuro vendido + Call comprado
  const futuroVenta = futuros.filter(l=>l.operacion==='Venta');
  const callCompra = calls.filter(l=>l.operacion==='Compra');
  if(futuroVenta.length && callCompra.length){
    const fut = futuroVenta[0];
    const precioMercado = fut.precioUsado;
    const callsOrdenados = callCompra.slice().sort((a,b)=>Number(a.strike)-Number(b.strike));
    const principal = callsOrdenados[0];
    const precioVenta = Number(fut.apertura);
    const strike = Number(principal.strike);
    const premium = Number(principal.apertura);
    const perdidaEstructural = strike - precioVenta; // diferencia entre el futuro y el strike del Call
    const pisoEfectivo = precioVenta - premium; // resultado neto por unidad una vez que el Call empieza a cubrir, descontando la prima
    let texto;
    if(precioMercado===null || precioMercado===undefined){
      texto = `Vendiste el futuro a ${fmtMoney(precioVenta,2)} y compraste un Call strike ${fmtMoney(strike,0)} (prima ${fmtMoney(premium,2)}). Por encima de ${fmtMoney(strike,0)} tu pérdida queda limitada a ${fmtMoney(perdidaEstructural,2)} u$s/tn (más la prima). Todavía no hay precio${esEscenario?' de escenario':' de cierre'} del futuro para ubicarte.`;
    } else if(precioMercado <= precioVenta){
      texto = `El futuro ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, en o por debajo de tu precio de venta (${fmtMoney(precioVenta,2)}): tu futuro está ganando ${fmtMoney(precioVenta-precioMercado,2)} u$s/tn, y el Call (strike ${fmtMoney(strike,0)}) no vale nada porque no llegó a su strike.`;
    } else if(precioMercado <= strike){
      texto = `El futuro ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, por encima de tu precio de venta (${fmtMoney(precioVenta,2)}) pero todavía no llegó al strike de tu Call (${fmtMoney(strike,0)}): tu futuro está perdiendo ${fmtMoney(precioMercado-precioVenta,2)} u$s/tn, y esa pérdida todavía NO está cubierta por el Call (sigue valiendo cero). El Call recién empieza a compensar a partir de ${fmtMoney(strike,0)}.`;
    } else {
      texto = `El futuro ${esEscenario?'estaría en':'cerró en'} ${fmtMoney(precioMercado,2)}, por encima del strike de tu Call (${fmtMoney(strike,0)}): a partir de ahí, cualquier suba adicional del mercado la absorbe la ganancia del Call, así que tu pérdida en el futuro queda limitada a la diferencia entre tu precio de venta y el strike: ${fmtMoney(perdidaEstructural,2)} u$s/tn. Descontando la prima pagada por el Call (${fmtMoney(premium,2)}), tu precio de venta efectivo (piso sintético) queda fijo en aproximadamente ${fmtMoney(pisoEfectivo,2)} u$s/tn, no importa cuánto siga subiendo el mercado.`;
    }
    if(callsOrdenados.length>1){
      texto += ` (Tenés ${callsOrdenados.length} Calls a distintos strikes; este diagnóstico usa el de strike más bajo, ${fmtMoney(strike,0)}, como referencia principal — a partir de los strikes más altos la cobertura se refuerza todavía más.)`;
    }
    return {tipo:'Put Sintético (Futuro vendido + Call comprado)', texto, totalReal, esEscenario};
  }

  return null;
}
function toggleDiagnostico(estrategiaId){
  if(STATE.ui.diagnosticosAbiertos.has(estrategiaId)) STATE.ui.diagnosticosAbiertos.delete(estrategiaId);

}

function escenarioEstrategiaGroups(legs, precio){
  const byId = {};
  legs.forEach(p=>{ const k = p.estrategiaId||p.id; (byId[k]=byId[k]||[]).push(p); });
  const grupos = Object.entries(byId).sort((a,b)=> (a[1][0].estrategia||'').localeCompare(b[1][0].estrategia||''));
  const valuarEscenario = p=>{
    const aplica = aplicaEscenarioA(p);
    const sc = scenarioValueFor(p, precio, aplica);
    return {...p, precioUsado: sc.valor, totalUSD: sc.total};
  };
  return grupos.map(([estrategiaId,ls])=>{
    const name = ls[0].estrategia || '(sin nombre)';
    const diag = diagnosticarEstrategia(ls, valuarEscenario, true);
    return `
    <div style="margin-bottom:22px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:#FBFCFA;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
        <span style="font-weight:700;color:var(--teal-ink);">${name}</span>
        <button class="icon-btn" title="Editar estrategia (nombre y posiciones)" onclick="openEditStrategy('${estrategiaId}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn" title="Eliminar toda la estrategia" onclick="deleteStrategyGroup('${estrategiaId}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a1 1 0 01-1 1H9a1 1 0 01-1-1V6"/></svg>
        </button>
      </div>
      ${diagnosticoPanelHTML(diag, 'esc_'+estrategiaId)}
      ${escenarioTable(ls, precio)}
    </div>`;
  }).join('');
}

      <label class="field">Precio / prima de apertura (u$s/tn)

/* =========================================================================
   RENDER PRINCIPAL
========================================================================= */
function renderPositionModal(){
  if(STATE.ui.editingPosition==='estrategia-edit') return estrategiaFormHTML(true);
  if(STATE.ui.editingPosition===true && STATE.ui.modalEstrategiaMode) return estrategiaFormHTML(false);
  return positionFormHTML(STATE.ui.editingPosition===true?null:STATE.ui.editingPosition);
}

function render(){
  const app = document.getElementById('app');
  const bodies = {
    dashboard: renderDashboard,
    posiciones: renderPosiciones,
    escenarios: renderEscenarios,
    datos: renderPrecios,
    historial: renderHistorial,
  };
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${STATE.seedOutdated ? `
      <div style="background:#FFF4E5;border-bottom:1px solid #F0C36D;color:#7A4B00;padding:10px 28px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <span>Hay una versión más nueva de los datos base de este dashboard (mejoras recientes). Si no hiciste cambios propios importantes, convendría recargarlos.</span>
        <span style="display:flex;gap:8px;flex:none;">
          <button class="btn btn-primary btn-sm" id="btnBannerReload">Recargar datos nuevos</button>
          <button class="btn btn-ghost btn-sm" id="btnBannerDismiss">Ya lo sé, ignorar</button>
        </span>
      </div>` : ''}
      ${renderTopbar()}
      <div class="content">${bodies[STATE.ui.tab]()}</div>
    </div>
    ${STATE.ui.editingPosition!==null && STATE.ui.editingPosition!=='close' ? renderPositionModal() : ''}
    ${STATE.ui.closingPosition ? closeFormHTML(STATE.ui.closingPosition) : ''}
    ${pendingConfirmAction ? confirmModalHTML() : ''}
  `;
  wireEvents();
}

/* =========================================================================
   EVENTOS
========================================================================= */
function openEdit(id){
  const p = STATE.positions.find(x=>x.id===id);
  STATE.ui.editingPosition = p;
  render();
}
function openAdd(){
  STATE.ui.editingPosition = true;
  STATE.ui.modalEstrategiaMode = false;
  modalDraftLegs = [blankDraftLeg(), blankDraftLeg()];
  modalDraftNombreEstrategia = '';
  modalDraftCarteraEstrategia = 'Acopio';
  modalEditingStrategyOriginal = null;
  render();
}
function openClose(id){
  const p = STATE.positions.find(x=>x.id===id);
  STATE.ui.closingPosition = p;
  render();
}
function deletePosition(id){
  askConfirm('¿Eliminar esta posición? No se puede deshacer.', ()=>{
    STATE.positions = STATE.positions.filter(x=>x.id!==id);
    savePositions();
    render();
    toast('Posición eliminada.');
  });
}
function openEditStrategy(estrategiaId){
  const legs = STATE.positions.filter(p=>p.estado==='Abierta' && p.estrategiaId===estrategiaId);
  if(!legs.length){ toast('No encontré esa estrategia.','err'); return; }
  modalDraftLegs = legs.map(p=>({
    id: p.id,
    grano: p.grano,
    granoEsOtro: !GRANOS_SUGERIDOS.includes(p.grano),
    instrumento: p.instrumento,
    operacion: p.operacion,
    vencimiento: p.vencimiento,
    tipoOpcion: p.tipoOpcion || 'Call',
    strike: p.strike || '',
    toneladas: p.toneladas,
    apertura: p.apertura,
  }));
  modalDraftNombreEstrategia = legs[0].estrategia || '';
  modalDraftCarteraEstrategia = legs[0].cartera;
  modalEditingStrategyOriginal = {estrategiaId, cartera: legs[0].cartera, nombre: legs[0].estrategia || ''};
  STATE.ui.editingPosition = 'estrategia-edit';
  render();
}
function deleteStrategyGroup(estrategiaId){
  const legs = STATE.positions.filter(p=>p.estado==='Abierta' && p.estrategiaId===estrategiaId);
  if(!legs.length) return;
  const nombre = legs[0].estrategia || '(sin nombre)';
  askConfirm(`¿Eliminar la estrategia completa "${nombre}" (${legs.length} posiciones)? No se puede deshacer.`, ()=>{
    STATE.positions = STATE.positions.filter(p=> !(p.estado==='Abierta' && p.estrategiaId===estrategiaId));
    savePositions();
    render();
    toast('Estrategia eliminada.');
  });
}
window.openEdit = openEdit;
window.openClose = openClose;
window.deletePosition = deletePosition;
window.openEditStrategy = openEditStrategy;
window.deleteStrategyGroup = deleteStrategyGroup;
window.setTab = setTab;

function wireEvents(){
  document.querySelectorAll('.navbtn').forEach(b=> b.onclick = ()=> setTab(b.dataset.tab));
  const btnAdd = document.getElementById('btnAddPos');
  if(btnAdd) btnAdd.onclick = openAdd;
  const btnAddEmpty = document.getElementById('btnAddPosEmpty');
  if(btnAddEmpty) btnAddEmpty.onclick = openAdd;

  // filtros posiciones
  const fCartera = document.getElementById('fCartera');
  if(fCartera) fCartera.onchange = e=>{ STATE.ui.filterCartera=e.target.value; render(); };
  const fGrano = document.getElementById('fGrano');
  if(fGrano) fGrano.onchange = e=>{ STATE.ui.filterGrano=e.target.value; render(); };
  const fEstado = document.getElementById('fEstado');
  if(fEstado) fEstado.onchange = e=>{ STATE.ui.filterEstado=e.target.value; render(); };
  const fSearch = document.getElementById('fSearch');
  if(fSearch){
    fSearch.oninput = e=>{ STATE.ui.search=e.target.value; };
    fSearch.onkeydown = e=>{ if(e.key==='Enter') render(); };
    fSearch.onblur = ()=> render();
  }

  // filtros resumen
  const rfCartera = document.getElementById('rfCartera');
  if(rfCartera) rfCartera.onchange = e=>{ STATE.ui.resumenFiltros.cartera=e.target.value; render(); };
  const rfGrano = document.getElementById('rfGrano');
  if(rfGrano) rfGrano.onchange = e=>{ STATE.ui.resumenFiltros.grano=e.target.value; render(); };
  const rfInstrumento = document.getElementById('rfInstrumento');
  if(rfInstrumento) rfInstrumento.onchange = e=>{ STATE.ui.resumenFiltros.instrumento=e.target.value; render(); };
  const rfOperacion = document.getElementById('rfOperacion');
  if(rfOperacion) rfOperacion.onchange = e=>{ STATE.ui.resumenFiltros.operacion=e.target.value; render(); };
  const rfMes = document.getElementById('rfMes');
  if(rfMes) rfMes.onchange = e=>{ STATE.ui.resumenFiltros.mes=e.target.value; render(); };
  const rfAnio = document.getElementById('rfAnio');
  if(rfAnio) rfAnio.onchange = e=>{ STATE.ui.resumenFiltros.anio=e.target.value; render(); };
  const rfPrecio = document.getElementById('rfPrecio');
  if(rfPrecio){
    rfPrecio.oninput = e=>{ STATE.ui.resumenFiltros.precio=e.target.value; };
    rfPrecio.onkeydown = e=>{ if(e.key==='Enter') render(); };
    rfPrecio.onblur = ()=> render();
  }
  const btnResetFiltrosResumen = document.getElementById('btnResetFiltrosResumen');
  if(btnResetFiltrosResumen) btnResetFiltrosResumen.onclick = ()=>{
    STATE.ui.resumenFiltros = {cartera:'Todas', grano:'Todos', instrumento:'Todos', operacion:'Todas', mes:'Todos', anio:'Todos', precio:''};
    render();
  };

  // modal alta/edicion
  const mGranoSel = document.getElementById('mGrano');
  if(mGranoSel){
    mGranoSel.onchange = ()=>{
      document.getElementById('wrapGranoOtro').style.display = mGranoSel.value==='__otro__' ? '' : 'none';
    };
  }
  const mInstrumento = document.getElementById('mInstrumento');
  if(mInstrumento){
    mInstrumento.onchange = ()=>{
      const isOp = mInstrumento.value==='Opcion';
      document.getElementById('wrapTipoOpcion').style.display = isOp?'':'none';
      document.getElementById('wrapStrike').style.display = isOp?'':'none';
    };
  }
  const btnConfirmYes = document.getElementById('btnConfirmYes');
  if(btnConfirmYes) btnConfirmYes.onclick = ()=>{
    const action = pendingConfirmAction;
    pendingConfirmAction = null;
    if(action) action();
  };
  const btnConfirmNo = document.getElementById('btnConfirmNo');
  if(btnConfirmNo) btnConfirmNo.onclick = ()=>{ pendingConfirmAction = null; render(); };

  const btnCancelModal = document.getElementById('btnCancelModal');
  if(btnCancelModal) btnCancelModal.onclick = ()=>{ STATE.ui.editingPosition=null; STATE.ui.closingPosition=null; STATE.ui.modalEstrategiaMode=false; modalEditingStrategyOriginal=null; render(); };

  const mEsEstrategia = document.getElementById('mEsEstrategia');
  if(mEsEstrategia){
    mEsEstrategia.onchange = ()=>{
      STATE.ui.modalEstrategiaMode = mEsEstrategia.checked;
      if(STATE.ui.modalEstrategiaMode && modalDraftLegs.length<2){ modalDraftLegs = [blankDraftLeg(), blankDraftLeg()]; }
      render();
    };
  }

  const btnAddLeg = document.getElementById('btnAddLeg');
  if(btnAddLeg) btnAddLeg.onclick = ()=>{ modalDraftLegs.push(blankDraftLeg()); render(); };

  const mCarteraEstrategia = document.getElementById('mCarteraEstrategia');
  if(mCarteraEstrategia) mCarteraEstrategia.onchange = ()=>{ modalDraftCarteraEstrategia = mCarteraEstrategia.value; };
  const mNombreEstrategia = document.getElementById('mNombreEstrategia');
  if(mNombreEstrategia) mNombreEstrategia.oninput = ()=>{ modalDraftNombreEstrategia = mNombreEstrategia.value; };

  document.querySelectorAll('[data-remove-leg]').forEach(btn=>{
    btn.onclick = ()=>{
      modalDraftLegs.splice(Number(btn.dataset.removeLeg), 1);
      render();
    };
  });

  document.querySelectorAll('[data-leg-field]').forEach(inp=>{
    const handler = e=>{
      const idx = Number(e.target.dataset.legIdx);
      const field = e.target.dataset.legField;
      if(field==='grano'){
        if(e.target.value==='__otro__'){ modalDraftLegs[idx].granoEsOtro = true; }
        else { modalDraftLegs[idx].granoEsOtro = false; modalDraftLegs[idx].grano = e.target.value; }
        render();
      } else if(field==='granoOtro'){
        modalDraftLegs[idx].grano = e.target.value;
      } else if(field==='instrumento'){
        modalDraftLegs[idx][field] = e.target.value;
        render();
      } else {
        modalDraftLegs[idx][field] = e.target.value;
      }
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });

  const btnSaveEstrategia = document.getElementById('btnSaveEstrategia');
  if(btnSaveEstrategia) btnSaveEstrategia.onclick = ()=>{
    const isEditingExisting = !!modalEditingStrategyOriginal;
    const cartera = isEditingExisting ? modalEditingStrategyOriginal.cartera : document.getElementById('mCarteraEstrategia').value;
    const nombre = document.getElementById('mNombreEstrategia').value.trim();
    if(!nombre){ toast('Ponele un nombre a la estrategia.','err'); return; }
    if(modalDraftLegs.length<2){ toast('Una estrategia necesita al menos 2 patas.','err'); return; }
    for(const leg of modalDraftLegs){
      if(!leg.grano || !leg.vencimiento || !leg.toneladas || !leg.apertura){
        toast('Completá grano, vencimiento, toneladas y precio de apertura en todas las patas.','err');
        return;
      }
    }
    const buildFields = leg=>({
      cartera,
      instrumento: leg.instrumento,
      grano: leg.grano,
      operacion: leg.operacion,
      vencimiento: leg.vencimiento,
      tipoOpcion: leg.instrumento==='Opcion' ? leg.tipoOpcion : '',
      strike: leg.instrumento==='Opcion' ? Number(leg.strike)||0 : 0,
      toneladas: Number(leg.toneladas)||0,
      apertura: Number(leg.apertura)||0,
      estrategia: nombre,
    });

    if(isEditingExisting){
      const estrategiaId = modalEditingStrategyOriginal.estrategiaId;
      const idsEnFormulario = new Set(modalDraftLegs.filter(l=>l.id).map(l=>l.id));
      // Actualiza las patas existentes, agrega las nuevas (sin id) y borra las que se hayan quitado del formulario.
      // Todo se identifica por estrategiaId, nunca por el nombre (para no mezclar con otra estrategia homónima).
      STATE.positions = STATE.positions
        .filter(p=> !(p.estado==='Abierta' && p.estrategiaId===estrategiaId) || idsEnFormulario.has(p.id))
        .map(p=>{
          const leg = modalDraftLegs.find(l=>l.id===p.id);
          return leg ? {...p, ...buildFields(leg)} : p;
        });
      const nuevasSinId = modalDraftLegs.filter(l=>!l.id).map(leg=>({
        id: uid(), ...buildFields(leg), estrategiaId, referencia:'', notas:'', estado:'Abierta', origen:'manual',
        fechaAlta:new Date().toISOString().slice(0,10), cierreManual:null, fechaCierre:null, precioCierreOperacion:null,
      }));
      STATE.positions = STATE.positions.concat(nuevasSinId);
      savePositions();
      STATE.ui.editingPosition = null;
      modalEditingStrategyOriginal = null;
      render();
      toast(`Estrategia "${nombre}" actualizada.`);
    } else {
      const estrategiaId = uid();
      const nuevas = modalDraftLegs.map(leg=>({
        id: uid(), ...buildFields(leg), estrategiaId, referencia:'', notas:'', estado:'Abierta', origen:'manual',
        fechaAlta:new Date().toISOString().slice(0,10), cierreManual:null, fechaCierre:null, precioCierreOperacion:null,
      }));
      STATE.positions = STATE.positions.concat(nuevas);
      savePositions();
      STATE.ui.editingPosition = null;
      STATE.ui.modalEstrategiaMode = false;
      render();
      toast(`Estrategia "${nombre}" agregada con ${nuevas.length} patas.`);
    }
  };

  const btnDeleteStrategyFromModal = document.getElementById('btnDeleteStrategyFromModal');
  if(btnDeleteStrategyFromModal) btnDeleteStrategyFromModal.onclick = ()=>{
    if(!modalEditingStrategyOriginal) return;
    const {estrategiaId, nombre} = modalEditingStrategyOriginal;
    askConfirm(`¿Eliminar la estrategia completa "${nombre}"? No se puede deshacer.`, ()=>{
      STATE.positions = STATE.positions.filter(p=> !(p.estado==='Abierta' && p.estrategiaId===estrategiaId));
      savePositions();
      STATE.ui.editingPosition = null;
      modalEditingStrategyOriginal = null;
      render();
      toast('Estrategia eliminada.');
    });
  };

  const btnSaveModal = document.getElementById('btnSaveModal');
  if(btnSaveModal) btnSaveModal.onclick = ()=>{
    const isEdit = STATE.ui.editingPosition!==true;
    const base = isEdit ? {...STATE.ui.editingPosition} : {
      id: uid(), estado:'Abierta', origen:'manual', estrategia:'', estrategiaId:null, fechaAlta:new Date().toISOString().slice(0,10), fechaCierre:null, precioCierreOperacion:null,
    };
    const instrumento = document.getElementById('mInstrumento').value;
    const cierreManualVal = document.getElementById('mCierreManual').value;
    const obj = {
      ...base,
      cartera: document.getElementById('mCartera').value,
      instrumento,
      grano: (document.getElementById('mGrano').value==='__otro__' ? document.getElementById('mGranoOtro').value.trim() : document.getElementById('mGrano').value),
      operacion: document.getElementById('mOperacion').value,
      vencimiento: document.getElementById('mVencimiento').value,
      tipoOpcion: instrumento==='Opcion' ? document.getElementById('mTipoOpcion').value : '',
      strike: instrumento==='Opcion' ? Number(document.getElementById('mStrike').value)||0 : 0,
      toneladas: Number(document.getElementById('mToneladas').value)||0,
      apertura: Number(document.getElementById('mApertura').value)||0,
      cierreManual: cierreManualVal!=='' ? Number(cierreManualVal) : null,
      referencia: document.getElementById('mReferencia').value.trim(),
      notas: document.getElementById('mNotas').value.trim(),
    };
    if(!obj.grano || !obj.vencimiento || !obj.toneladas || !obj.apertura){
      toast('Completá al menos grano, vencimiento, toneladas y precio de apertura.','err');
      return;
    }
    if(isEdit){
      STATE.positions = STATE.positions.map(p=> p.id===obj.id? obj : p);
    } else {
      STATE.positions.push(obj);
    }
    savePositions();
    STATE.ui.editingPosition = null;
    render();
    toast(isEdit? 'Posición actualizada.' : 'Posición agregada.');
  };

  const btnConfirmClose = document.getElementById('btnConfirmClose');
  if(btnConfirmClose) btnConfirmClose.onclick = ()=>{
    const precio = Number(document.getElementById('mPrecioCierre').value);
    const fecha = document.getElementById('mFechaCierre').value;
    if(isNaN(precio)){ toast('Ingresá un precio de cierre válido.','err'); return; }
    const id = STATE.ui.closingPosition.id;
    STATE.positions = STATE.positions.map(p=> p.id===id ? {...p, estado:'Cerrada', precioCierreOperacion:precio, fechaCierre:fecha} : p);
    savePositions();
    STATE.ui.closingPosition = null;
    render();
    toast('Posición cerrada.');
  };

  // filtros escenarios
  const esCartera = document.getElementById('esCartera');
  if(esCartera) esCartera.onchange = e=>{ STATE.ui.escenarioFiltros.cartera=e.target.value; render(); };
  const esGrano = document.getElementById('esGrano');
  if(esGrano) esGrano.onchange = e=>{ STATE.ui.escenarioFiltros.grano=e.target.value; render(); };
  const esInstrumento = document.getElementById('esInstrumento');
  if(esInstrumento) esInstrumento.onchange = e=>{ STATE.ui.escenarioFiltros.instrumento=e.target.value; render(); };
  const esOperacion = document.getElementById('esOperacion');
  if(esOperacion) esOperacion.onchange = e=>{ STATE.ui.escenarioFiltros.operacion=e.target.value; render(); };
  const esMes = document.getElementById('esMes');
  if(esMes) esMes.onchange = e=>{ STATE.ui.escenarioFiltros.mes=e.target.value; render(); };
  const esAnio = document.getElementById('esAnio');
  if(esAnio) esAnio.onchange = e=>{ STATE.ui.escenarioFiltros.anio=e.target.value; render(); };
  const esPrecio = document.getElementById('esPrecio');
  if(esPrecio){
    esPrecio.oninput = e=>{ STATE.ui.escenarioFiltros.precio=e.target.value; };
    esPrecio.onkeydown = e=>{ if(e.key==='Enter') render(); };
    esPrecio.onblur = ()=> render();
  }
  const btnResetFiltrosEscenario = document.getElementById('btnResetFiltrosEscenario');
  if(btnResetFiltrosEscenario) btnResetFiltrosEscenario.onclick = ()=>{
    STATE.ui.escenarioFiltros = {cartera:'Todas', grano:'Todos', instrumento:'Todos', operacion:'Todas', mes:'Todos', anio:'Todos', precio:''};
    render();
  };

  async function reloadSeedData(){
    STATE.positions = SEED_POSITIONS.map(p=>({...p}));
    STATE.priceMap = {...SEED_PRICES};
    STATE.priceMeta = {...SEED_META};
    STATE.scenarioPrices = {};
    STATE.referencias = JSON.parse(JSON.stringify(SEED_REFERENCIAS));
    STATE.seedOutdated = false;
    await savePositions();
    await savePrices();
    await saveScenarios();
    await saveReferencias();
    try{ await storageAdapter.set(STORAGE_KEY_SEED_VERSION, SEED_VERSION); }catch(e){}
    render();
    toast('Datos originales del Excel recargados.');
  }

  const btnReloadSeed = document.getElementById('btnReloadSeed');
  if(btnReloadSeed) btnReloadSeed.onclick = ()=>{
    askConfirm('¿Reemplazar todo lo cargado en este navegador por los datos originales del archivo MTR_Rofex_Posi.xlsx? No se puede deshacer.', reloadSeedData);
  };

  const btnBannerReload = document.getElementById('btnBannerReload');
  if(btnBannerReload) btnBannerReload.onclick = ()=>{
    askConfirm('¿Reemplazar todo lo cargado en este navegador por los datos originales del archivo MTR_Rofex_Posi.xlsx? No se puede deshacer.', reloadSeedData);
  };
  const btnBannerDismiss = document.getElementById('btnBannerDismiss');
  if(btnBannerDismiss) btnBannerDismiss.onclick = async ()=>{
    STATE.seedOutdated = false;
    try{ await storageAdapter.set(STORAGE_KEY_SEED_VERSION, SEED_VERSION); }catch(e){}
    render();
  };

  const btnResetAll = document.getElementById('btnResetAll');
  if(btnResetAll) btnResetAll.onclick = ()=>{
    askConfirm('¿Vaciar todas las posiciones, precios y escenarios cargados? No se puede deshacer.', async ()=>{
      STATE.positions = [];
      STATE.priceMap = {};
      STATE.priceMeta = {fecha:null, fuente:null};
      STATE.scenarioPrices = {};
      STATE.referencias = {};
      await savePositions();
      await savePrices();
      await saveScenarios();
      await saveReferencias();
      render();
      toast('Datos vaciados.');
    });
  };

  // import
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz){
    dz.onclick = ()=> fi.click();
    dz.ondragover = e=>{ e.preventDefault(); dz.classList.add('drag'); };
    dz.ondragleave = ()=> dz.classList.remove('drag');
    dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) processFiles(e.dataTransfer.files); };
  }
  if(fi) fi.onchange = e=>{ if(e.target.files.length) processFiles(e.target.files); };

  const btnActualizarVista = document.getElementById('btnActualizarVista');
  if(btnActualizarVista) btnActualizarVista.onclick = ()=>{ render(); toast('Vista actualizada.'); };
}
