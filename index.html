<style>
  :root{
    --teal:#005457;
    --teal-ink:#013638;
    --green:#A4CC39;
    --green-ink:#4C6B17;
    --bg:#F3F5F1;
    --surface:#FFFFFF;
    --ink:#10231F;
    --muted:#5B6B63;
    --border:#DFE4DC;
    --gain:#3C7A3E;
    --gain-bg:#EAF3E4;
    --loss:#A6432E;
    --loss-bg:#FBEBE7;
    --radius:8px;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
  }
  ::selection{background:var(--green);color:var(--teal-ink);}
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex:none;background:var(--teal);color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:16px;}
  .brand-dot{width:26px;height:26px;border-radius:50%;background:var(--green);flex:none;position:relative;}
  .brand-dot::after{content:"";position:absolute;inset:6px;border:2px solid var(--teal);border-radius:50%;}
  .brand-name{font-weight:700;font-size:14.5px;letter-spacing:.2px;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:rgba(255,255,255,.65);margin-top:1px;}
  .navbtn{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:transparent;border:none;color:rgba(255,255,255,.78);
    font-family:inherit;font-size:13.5px;font-weight:500;
    padding:10px 12px;border-radius:6px;cursor:pointer;transition:background .12s;
  }
  .navbtn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .navbtn.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--green);}
  .navbtn svg{width:16px;height:16px;flex:none;}
  .sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.15);padding-top:14px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--teal-ink);}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .content{padding:24px 28px 60px;max-width:1360px;width:100%;margin:0;}

  .btn{
    font-family:inherit;font-size:13px;font-weight:600;border-radius:6px;border:1px solid transparent;
    padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .12s,background .12s;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--green);color:var(--teal-ink);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;color:var(--teal-ink);border-color:var(--border);}
  .btn-ghost:hover{background:#EEF2ED;}
  .btn-danger{background:transparent;color:var(--loss);border-color:var(--loss);}
  .btn-danger:hover{background:var(--loss-bg);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-head h2{font-size:14.5px;margin:0;font-weight:700;color:var(--teal-ink);}
  .card-head .hint{font-size:11.5px;color:var(--muted);}
  .card-body{padding:16px 18px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal);}
  .kpi.gain .accent{background:var(--gain);}
  .kpi.loss .accent{background:var(--loss);}
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:600;}
  .kpi-value{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--teal-ink);}
  .kpi-value.gain{color:var(--gain);}
  .kpi-value.loss{color:var(--loss);}
  .kpi-note{font-size:11.5px;color:var(--muted);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;font-size:11px;text-transform:none;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:#F7F9F6;}
  .num{text-align:right;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-acopio{background:#E4EEEF;color:var(--teal-ink);}
  .tag-siembras{background:#EFF5DD;color:var(--green-ink);}
  .tag-fut{background:#EFF1EE;color:var(--muted);}
  .tag-op{background:#F3ECE0;color:#8A5A20;}
  .pill-compra{color:var(--gain);font-weight:700;}
  .pill-venta{color:var(--loss);font-weight:700;}
  .val-gain{color:var(--gain);font-weight:700;}
  .val-loss{color:var(--loss);font-weight:700;}
  .val-na{color:var(--muted);font-style:italic;font-weight:400;}
  .row-closed{opacity:.5;}
  .row-closed td{text-decoration:line-through;text-decoration-color:var(--muted);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  select,input[type=text],input[type=number],input[type=date]{
    font-family:inherit;font-size:12.8px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);
  }
  select:focus,input:focus{outline:2px solid var(--green);outline-offset:1px;}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;}

  .table-scroll{overflow-x:auto;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty h3{color:var(--teal-ink);margin-bottom:6px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(16,35,31,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100;}
  .modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:22px 24px;}
  .modal h3{margin:0 0 4px;color:var(--teal-ink);font-size:16px;}
  .modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--teal-ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:200;max-width:360px;}
  .toast.err{background:var(--loss);}

  .badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
  .dropzone{border:1.5px dashed var(--border);border-radius:8px;padding:22px;text-align:center;color:var(--muted);font-size:12.8px;cursor:pointer;transition:border-color .15s,background .15s;}
  .dropzone:hover,.dropzone.drag{border-color:var(--teal);background:#F1F6F5;}
  .dropzone input{display:none;}
  .source-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:#EFF3EC;border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:960px){
    .sidebar{width:64px;padding:16px 8px;}
    .brand-name,.brand-sub,.navbtn span{display:none;}
    .navbtn{justify-content:center;}
    .grid-2{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
  .link-btn{background:none;border:none;color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;}
  .icon-btn:hover{background:#EEF2ED;color:var(--loss);}
  .small-muted{font-size:11.5px;color:var(--muted);}

  /* ---------- Autenticación ---------- */
  .auth-loading{
    position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;
  }
  .auth-spinner{
    width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:authSpin .8s linear infinite;
  }
  @keyframes authSpin{ to{transform:rotate(360deg);} }
  .auth-screen{
    position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:900;overflow-y:auto;
  }
  .auth-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:390px;padding:32px 28px;box-shadow:0 12px 36px rgba(0,84,87,.08);
  }
  .auth-brand{
    display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px;
  }
  .auth-brand .brand-name{color:var(--teal-ink);font-size:16px;font-weight:700;}
  .auth-brand .brand-sub{color:var(--muted);font-size:11.5px;}
  .auth-head h2{font-size:18px;margin:0 0 6px;color:var(--teal-ink);font-weight:700;}
  .auth-head p{font-size:12.5px;color:var(--muted);margin:0 0 20px;line-height:1.45;}
  .auth-form{display:flex;flex-direction:column;gap:14px;}
  .auth-form label.field span{color:var(--teal-ink);font-weight:600;font-size:12px;margin-bottom:4px;}
  .auth-form input{padding:10px 12px;font-size:13.5px;border-radius:6px;border:1px solid var(--border);width:100%;}
  .auth-form input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .auth-alert{padding:10px 14px;border-radius:6px;font-size:12px;background:var(--loss-bg);color:var(--loss);border:1px solid #F5C6CB;margin-bottom:16px;line-height:1.4;}
  .btn-block{width:100%;justify-content:center;padding:11px 16px;font-size:13.5px;margin-top:6px;}
  .auth-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;color:var(--muted);}
  .navbtn-logout{color:rgba(255,255,255,.75);margin-top:4px;}
  .navbtn-logout:hover{background:rgba(166,67,46,.25);color:#FFB4A2;}
</style>

  }catch(e){ STATE.scenarioPrices = {}; }
  try{

    STATE.referencias = rf ? JSON.parse(rf.value) : {...SEED_REFERENCIAS};

    STATE.historialDiferenciasDiarias = hd ? JSON.parse(hd.value) : {...SEED_HISTORIAL_DIFERENCIAS};
  }catch(e){ STATE.historialDiferenciasDiarias = {}; }

  // ¿Los datos guardados en este navegador vienen de una versión anterior de la app?
  let storedVersion = null;
  try{ storedVersion = (await storageAdapter.get(STORAGE_KEY_SEED_VERSION).catch(()=>null))?.value || null; }catch(e){ storedVersion = null; }
  if(!usedStoredPositions){

function uid(){ return 'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function fmtMoney(n, dec=2){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtTns(n){ return (n||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function fmtUSD(n, withSign=true){
  if(n===null||n===undefined||isNaN(n)) return '<span class="val-na">s/d</span>';
  const cls = n>0?'val-gain':(n<0?'val-loss':'');
  const sign = withSign && n>0 ? '+' : '';
  return `<span class="${cls}">${sign}${fmtMoney(n,0)}</span>`;
}
function granoCode(g){ return (g||'').trim().toUpperCase().slice(0,3); }
function vtoToDate(v){
  // v esperado "YYYY-MM"
  if(!v) return null;
  const [y,m] = v.split('-').map(Number);
  return {y, m};
}
function mesAbbr(m){ return MESES[(m-1+12)%12]; }
function buildFutTicker(grano, vto){
  const d = vtoToDate(vto); if(!d) return null;
  const yy = String(d.y).slice(-2);
  return `${granoCode(grano)}.ROS/${mesAbbr(d.m)}${yy}`;
}
function buildOptTicker(grano, vto, strike, tipo){
  const d = vtoToDate(vto); if(!d) return null;
  const yy = String(d.y).slice(-2);
  const letra = (tipo||'').trim().charAt(0).toUpperCase();
  const strikeStr = (Number(strike)%1===0) ? String(Number(strike)) : String(strike);
  return `${granoCode(grano)}.ROS/${mesAbbr(d.m)}${yy} ${strikeStr} ${letra}`;
}
function tickerFor(pos){
  return pos.instrumento==='Futuro'
    ? buildFutTicker(pos.grano, pos.vencimiento)
    : buildOptTicker(pos.grano, pos.vencimiento, pos.strike, pos.tipoOpcion);
}
const FECHA_SIN_DATO = '0000-00-00'; // clave interna para precios cargados sin columna de fecha (ordena siempre como la más vieja)

function normalizarEntradaPrecio(entry){
  // Soporta 3 formatos: el nuevo {porFecha:{fecha:{ajuste,fuente}, ...}}, el intermedio
  // {hoy:{...}, ayer:{...}|null}, y el viejo plano {ajuste, fuente}. Siempre devuelve el formato
  // nuevo, con TODAS las fechas cargadas para ese ticker (no solo las últimas dos).
  if(!entry) return {porFecha:{}};
  if(entry.porFecha) return entry;
  if(entry.hoy !== undefined){
    const porFecha = {};
    if(entry.hoy) porFecha[entry.hoy.fecha || FECHA_SIN_DATO] = {ajuste:entry.hoy.ajuste, fuente:entry.hoy.fuente};
    if(entry.ayer) porFecha[entry.ayer.fecha || FECHA_SIN_DATO] = {ajuste:entry.ayer.ajuste, fuente:entry.ayer.fuente};
    return {porFecha};
  }
  return {porFecha: {[FECHA_SIN_DATO]: {ajuste:entry.ajuste, fuente:entry.fuente}}};
}
function fechasCargadas(entry){
  return Object.keys(entry.porFecha).sort(); // los ISO (YYYY-MM-DD) ordenan bien como texto
}
function mergePreciosConHistorial(nuevoMapa, fecha){
  // nuevoMapa: {ticker: {ajuste, fuente}} - valores recién cargados, todos de la fecha "fecha".
  // Simplemente se guarda el precio bajo esa fecha puntual — nunca se "corre una ficha": el sistema
  // siempre calcula hoy/ayer ordenando TODAS las fechas cargadas y tomando las dos más recientes,
  // sin importar en qué orden se hayan subido los archivos ni si te olvidaste de alguno.
  const fechaKey = fecha || FECHA_SIN_DATO;
  Object.keys(nuevoMapa).forEach(ticker=>{
    const actual = normalizarEntradaPrecio(STATE.priceMap[ticker]);
    actual.porFecha[fechaKey] = {ajuste:nuevoMapa[ticker].ajuste, fuente:nuevoMapa[ticker].fuente};
    STATE.priceMap[ticker] = actual;
  });
  // Si en este lote vinieron precios de FUTUROS (ticker sin espacio) y tenemos la fecha del archivo,
  // registramos/actualizamos el historial de "Diferencia diaria" de ese día puntual. Las opciones
  // nunca disparan esto: su fecha no afecta el cálculo de Principal (no aportan precio propio ahí).
  const huboFuturos = Object.keys(nuevoMapa).some(t=>!t.includes(' '));
  if(fecha && huboFuturos){
    registrarHistorialDiferenciaDiaria(fecha);
  }
}
function precioEnFecha(pos, fechaObjetivo){
  const t = tickerFor(pos);
  if(!t || !fechaObjetivo) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  return entry.porFecha[fechaObjetivo] ? entry.porFecha[fechaObjetivo].ajuste : null;
}
function fechaAnteriorA(pos, fechaObjetivo){
  const t = tickerFor(pos);
  if(!t) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  const fechas = fechasCargadas(entry).filter(f=>f < fechaObjetivo && f!==FECHA_SIN_DATO);
  return fechas.length ? fechas[fechas.length-1] : null;
}
function registrarHistorialDiferenciaDiaria(fecha){
  // Calcula el resultado de ESTA fecha puntual: su propio cierre vs. el cierre inmediatamente
  // anterior que tenga cargado cada futuro (no "el más reciente de todos", que puede ser una
  // fecha futura respecto a esta si se está reconstruyendo o completando historial hacia atrás).
  const abiertas = STATE.positions.filter(p=>p.estado==='Abierta');
  const porGrupo = {};
  abiertas.forEach(p=>{ const k = p.estrategiaId || ('__suelto_'+p.id); (porGrupo[k]=porGrupo[k]||[]).push(p); });
  let total = 0;
  Object.values(porGrupo).forEach(legs=>{
    const futuros = legs.filter(p=>p.instrumento==='Futuro');
    const calls = legs.filter(p=>p.instrumento==='Opcion' && p.tipoOpcion==='Call' && p.operacion==='Compra');
    futuros.forEach(fut=>{
      const hoy = precioEnFecha(fut, fecha);
      if(hoy===null||hoy===undefined) return;
      const apertura = Number(fut.apertura);
      const fechaAnt = fechaAnteriorA(fut, fecha);
      const ayer = fechaAnt!==null ? precioEnFecha(fut, fechaAnt) : null;
      const hayAyer = ayer!==null && ayer!==undefined;
      const base = hayAyer ? ayer : apertura;
      const pnlHoy = pnlTramoFuturo(fut, calls, apertura, hoy);
      const pnlAyer = hayAyer ? pnlTramoFuturo(fut, calls, apertura, ayer) : 0;
      total += (pnlHoy - pnlAyer);
    });
  });
  if(!STATE.historialDiferenciasDiarias) STATE.historialDiferenciasDiarias = {};
  STATE.historialDiferenciasDiarias[fecha] = {total, calculadoEn: new Date().toISOString()};
  saveHistorialDiferencias();
}
function marketPriceFor(pos){
  const t = tickerFor(pos);
  if(!t) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  const fechas = fechasCargadas(entry);
  if(!fechas.length) return null;
  return entry.porFecha[fechas[fechas.length-1]].ajuste;
}
function marketPriceForAyer(pos){
  const t = tickerFor(pos);
  if(!t) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  const fechas = fechasCargadas(entry);
  if(fechas.length<2) return null;
  return entry.porFecha[fechas[fechas.length-2]].ajuste;
}
function fechaHoyDe(pos){
  const t = tickerFor(pos);
  if(!t) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  const fechas = fechasCargadas(entry);
  if(!fechas.length) return null;
  const f = fechas[fechas.length-1];
  return f===FECHA_SIN_DATO ? null : f;
}
function fechaAyerDe(pos){
  const t = tickerFor(pos);
  if(!t) return null;
  const entry = normalizarEntradaPrecio(STATE.priceMap[t.toUpperCase()]);
  const fechas = fechasCargadas(entry);
  if(fechas.length<2) return null;
  const f = fechas[fechas.length-2];
  return f===FECHA_SIN_DATO ? null : f;
}
function usedPriceFor(pos){
  if(pos.estado==='Cerrada'){
    return (pos.precioCierreOperacion!==null && pos.precioCierreOperacion!==undefined) ? pos.precioCierreOperacion : null;
  }
  if(pos.cierreManual!==null && pos.cierreManual!==undefined && pos.cierreManual!=='') return Number(pos.cierreManual);
  return marketPriceFor(pos);
}
function diffUnitFor(pos, precio){
  if(precio===null || precio===undefined || isNaN(precio)) return null;
  const ap = Number(pos.apertura);
  return pos.operacion==='Venta' ? (ap - precio) : (precio - ap);
}
function enrich(pos){
  const precio = usedPriceFor(pos);
  const diffU = diffUnitFor(pos, precio);
  const total = diffU===null ? null : diffU*Number(pos.toneladas||0);
  return {...pos, ticker:tickerFor(pos), precioUsado:precio, diffUnit:diffU, totalUSD:total,
           precioEsManual: pos.estado!=='Cerrada' && pos.cierreManual!==null && pos.cierreManual!==undefined && pos.cierreManual!=='' };
}

/* =========================================================================
   IMPORTACION DE EXCEL / CSV
========================================================================= */
function gridFromSheet(ws){
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}
function cellText(v){ return (typeof v==='string') ? v.trim() : v; }

function findAnchors(grid){
  // busca celdas 'Futuros'/'Opciones'/'Estrategias' con vecino izquierdo 'Acopio'/'Siembras'
  const anchors = [];
  for(let r=0;r<grid.length;r++){
    const row = grid[r]||[];
    for(let c=1;c<row.length;c++){
      const v = cellText(row[c]);
      if(typeof v==='string' && ['Futuros','Opciones','Estrategias'].includes(v)){
        const left = cellText(row[c-1]);
        if(left==='Acopio' || left==='Siembras'){
          anchors.push({row:r, col:c, cartera:left, tipoTabla:v});
        }
      }
    }
  }
  anchors.sort((a,b)=>a.row-b.row);
  return anchors;
}

function excelDateToVto(v){
  if(v && typeof v==='object' && typeof v.getFullYear==='function'){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
  }
  if(typeof v==='number'){ // fecha serial excel
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}`;
  }
  return null;
}

function parseLegBlock(grid, anchor, nextAnchorRow, cartera){
  const headerRow = grid[anchor.row+1] || [];
  // localizar columnas por texto de encabezado, buscando desde anchor.col-1 hasta +9
  const colMap = {};
  for(let c=Math.max(0,anchor.col-1); c<anchor.col+10; c++){
    const h = cellText(headerRow[c]);
    if(typeof h!=='string') continue;
    const hl = h.toLowerCase();
    if(hl==='grano') colMap.grano=c;
    else if(hl==='op') colMap.op=c;
    else if(hl==='tipo') colMap.tipo=c;
    else if(hl.startsWith('posic')) colMap.vto=c;
    else if(hl==='strike') colMap.strike=c;
    else if(hl==='tns') colMap.tns=c;
    else if(hl.startsWith('$ prom apert') || hl.startsWith('$ apert')) colMap.apertura=c;
  }
  if(colMap.grano===undefined || colMap.op===undefined) return {legs:[], legend:{}};
  const labelCol = anchor.col-1;
  const dataStart = anchor.row+2;
  const hardLimit = nextAnchorRow!==null ? nextAnchorRow-1 : Math.min(grid.length, anchor.row+40);
  const legs = [];
  const legend = {}; // "2)" -> descripción tomada del pie de la hoja
  let blankStreak = 0;
  let currentGroupLabel = null;
  let currentGroupId = null;
  let groupCounter = 0;
  let inGroup = false; // seguimos dentro del mismo grupo mientras no haya un corte en blanco
  const isEstrategia = anchor.tipoTabla==='Estrategias';
  for(let r=dataStart; r<=hardLimit && r<grid.length; r++){
    const row = grid[r]||[];
    const opVal = cellText(row[colMap.op]);
    const granoVal = cellText(row[colMap.grano]);
    const labelVal = cellText(row[labelCol]);
    const validOp = (typeof opVal==='string') && ['compra','venta'].includes(opVal.trim().toLowerCase());
    if(!validOp || !granoVal){
      // ¿es una fila de referencia/leyenda al pie (número + texto descriptivo, sin operación)?
      if(labelVal && typeof granoVal==='string' && granoVal.trim().length>8){
        const key = labelVal.toString().trim();
        legend[key] = legend[key] ? `${legend[key]} / ${granoVal.trim()}` : granoVal.trim();
        blankStreak = 0;
        continue;
      }
      inGroup = false;
      blankStreak++;
      if(blankStreak>=6) break;
      continue;
    }
    blankStreak = 0;
    if(labelVal){
      currentGroupLabel = String(labelVal).trim();
      groupCounter++;
      currentGroupId = uid();
      inGroup = true;
    } else if(!inGroup){
      currentGroupLabel = null;
      groupCounter++;
      currentGroupId = uid();
      inGroup = true;
    }
    const tipoVal = colMap.tipo!==undefined ? cellText(row[colMap.tipo]) : null;
    const isFut = !tipoVal || tipoVal.toString().toLowerCase().startsWith('fut');
    const vtoRaw = row[colMap.vto];
    const vto = excelDateToVto(vtoRaw);
    const strike = colMap.strike!==undefined ? (Number(row[colMap.strike])||0) : 0;
    const tns = Number(row[colMap.tns])||0;
    const apertura = Number(row[colMap.apertura])||0;
    if(!vto || !tns) continue;
    legs.push({
      id: uid(),
      cartera: cartera,
      instrumento: isFut ? 'Futuro' : 'Opcion',
      grano: granoVal.toString().trim(),
      operacion: opVal.trim().charAt(0).toUpperCase()+opVal.trim().slice(1).toLowerCase(),
      vencimiento: vto,
      tipoOpcion: isFut ? '' : (tipoVal||'').toString().trim(),
      strike: isFut ? 0 : strike,
      toneladas: tns,
      apertura: apertura,
      estrategia: isEstrategia ? (currentGroupLabel || `Estrategia ${groupCounter}`) : '',
      estrategiaId: isEstrategia ? currentGroupId : null,
      referencia: (labelVal!==null && labelVal!==undefined && labelVal!=='') ? String(labelVal).trim() : '',
      notas:'',
      estado:'Abierta',
      origen:'importado',
      fechaAlta: new Date().toISOString().slice(0,10),
      cierreManual: null,
      fechaCierre: null,
      precioCierreOperacion: null,
    });
  }
  return {legs, legend};
}

function parsePosiSeparada(ws){
  const grid = gridFromSheet(ws);
  const anchors = findAnchors(grid);
  let legs = [];
  const legendByCartera = {};
  anchors.forEach((a)=>{
    // Acopio y Siembras suelen correr en paralelo (columnas distintas) por el mismo rango de filas.
    // Solo debe acotar el bloque otra ancla del MISMO lado (columna cercana), no la del lado opuesto.
    const sameSide = x => (x.col<20) === (a.col<20);
    const laterRows = anchors.filter(x=>x.row>a.row && sameSide(x)).map(x=>x.row);
    const next = laterRows.length ? Math.min(...laterRows) : null;
    const {legs:blockLegs, legend} = parseLegBlock(grid, a, next, a.cartera);
    legendByCartera[a.cartera] = {...(legendByCartera[a.cartera]||{}), ...legend};
    legs = legs.concat(blockLegs);
  });
  // Completar el nombre de la estrategia con la descripción del pie de hoja, cuando exista
  legs = legs.map(l=>{
    if(!l.estrategia) return l;
    const leyenda = (legendByCartera[l.cartera]||{})[l.estrategia];
    return leyenda ? {...l, estrategia: `${l.estrategia} ${leyenda}`} : l;
  });
  return {legs, legendByCartera};
}

function parseBaseSheetGeneric(ws){
  const grid = gridFromSheet(ws);
  if(!grid.length) return {};
  const header = grid[0].map(h=> (typeof h==='string'? h.trim().toUpperCase() : h));
  let colTicker = header.findIndex(h=> typeof h==='string' && (h.includes('TIPO CONTRATO') || h.includes('SIMBOLO') || h.includes('TICKER')));
  let colAjuste = header.findIndex(h=> typeof h==='string' && h.includes('AJUSTE'));
  if(colAjuste===-1) colAjuste = header.findIndex(h=> typeof h==='string' && (h.includes('CIERRE') || h==='ULTIMO'));
  if(colTicker===-1 || colAjuste===-1) return {};
  const map = {};
  for(let r=1;r<grid.length;r++){
    const row = grid[r]||[];
    const t = cellText(row[colTicker]);
    const a = row[colAjuste];
    if(typeof t==='string' && t.trim() && typeof a==='number'){
      map[t.trim().toUpperCase()] = {ajuste:a, fuente:'archivo'};
    }
  }
  return map;
}

function handleWorkbook(wb, fileName){
  let importedLegs = [];
  let importedPrices = {};
  let importedReferencias = null;
  let foundPosiciones = false, foundPrecios = false;

  const posiSheetName = wb.SheetNames.find(n=> n.toLowerCase().includes('posi'));
  if(posiSheetName){
    const resultado = parsePosiSeparada(wb.Sheets[posiSheetName]);
    importedLegs = resultado.legs;
    importedReferencias = resultado.legendByCartera;
    foundPosiciones = importedLegs.length>0;
  }
  wb.SheetNames.forEach(name=>{
    const nl = name.toLowerCase();
    if(nl.includes('base futuro') || nl.includes('base opcion') || nl.includes('futuros') || nl.includes('opciones')){
      const m = parseBaseSheetGeneric(wb.Sheets[name]);
      if(Object.keys(m).length){ importedPrices = {...importedPrices, ...m}; foundPrecios = true; }
    }
  });

  if(foundPrecios){
    mergePreciosConHistorial(importedPrices);
    STATE.priceMeta = {fecha: new Date().toISOString().slice(0,10), fuente: fileName};
    savePrices();
  }
  if(foundPosiciones){
    // Evita duplicados: una nueva importación reemplaza las posiciones abiertas
    // que vinieron de una importación anterior. No toca las cargadas a mano
    // ni las que ya se marcaron como cerradas (quedan como historial).
    const conservar = STATE.positions.filter(p => p.origen==='manual' || p.estado==='Cerrada');
    STATE.positions = conservar.concat(importedLegs.map(l=>({...l, origen:'importado'})));
    savePositions();
    if(importedReferencias){
      STATE.referencias = importedReferencias;
      saveReferencias();
    }
  }
  return {legs: importedLegs.length, prices: Object.keys(importedPrices).length, foundPosiciones, foundPrecios};
}

function parseNumEs(str){
  // Los exports de Rofex/MATba usan coma como separador decimal (ej: "215,700000").
  // parseFloat нативо corta en la coma y trunca el número — por eso lo convertimos primero.
  if(typeof str==='number') return str;
  if(typeof str!=='string') return NaN;
  const limpio = str.trim().replace(/\./g,'').replace(',', '.');
  return parseFloat(limpio);
}
function parseFechaCsv(str){
  // Los CSV de Rofex/MATba traen la fecha como DD-MM-YYYY (ej: "01-09-2026"). La devolvemos en
  // formato ISO YYYY-MM-DD para que se pueda ordenar y comparar como texto sin ambigüedad.
  if(!str) return null;
  const s = String(str).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  return null;
}
function handleCsvPrices(parsedRows, fileName){
  if(!parsedRows.length) return {prices:0};
  const original = Object.keys(parsedRows[0]);
  let tickerKey = original.find(k=> k.trim().toUpperCase().includes('TIPO CONTRATO') || k.trim().toUpperCase().includes('SIMBOLO') || k.trim().toUpperCase().includes('TICKER'));
  let ajusteKey = original.find(k=> k.trim().toUpperCase().includes('AJUSTE'));
  if(!ajusteKey) ajusteKey = original.find(k=> k.trim().toUpperCase().includes('CIERRE') || k.trim().toUpperCase()==='ULTIMO');
  let fechaKey = original.find(k=> k.trim().toUpperCase().includes('FECHA'));
  if(!tickerKey || !ajusteKey) return {prices:0, error:true};
  const map = {};
  let fechaArchivo = null;
  parsedRows.forEach(row=>{
    const t = row[tickerKey];
    const a = parseNumEs(row[ajusteKey]);
    if(t && !isNaN(a)) map[String(t).trim().toUpperCase()] = {ajuste:a, fuente:'csv'};
    if(!fechaArchivo && fechaKey && row[fechaKey]) fechaArchivo = parseFechaCsv(row[fechaKey]);
  });
  mergePreciosConHistorial(map, fechaArchivo);
  STATE.priceMeta = {fecha: fechaArchivo || new Date().toISOString().slice(0,10), fuente:fileName};
  savePrices();
  return {prices:Object.keys(map).length, fecha:fechaArchivo};
}

function processFile(file){
  return new Promise((resolve)=>{
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        if(name.endsWith('.csv')){
          Papa.parse(new TextDecoder('utf-8').decode(e.target.result), {
            header:true, skipEmptyLines:true,
            complete: (res)=>{
              const r = handleCsvPrices(res.data, file.name);
              resolve({file:file.name, ...r});
            }
          });
        } else {
          const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
          const r = handleWorkbook(wb, file.name);
          resolve({file:file.name, ...r});
        }
      }catch(err){
        console.error(err);
        resolve({file:file.name, error:true, mensaje:err.message});
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

async function processFiles(fileList){
  const files = Array.from(fileList);
  if(!files.length) return;
  const resultados = [];
  for(const file of files){
    resultados.push(await processFile(file));
  }
  let totalPosiciones = 0, totalPrecios = 0;
  const errores = [];
  resultados.forEach(r=>{
    if(r.error){ errores.push(`${r.file}: ${r.mensaje || 'no se reconoció la estructura'}`); return; }
    const esCsv = r.file.toLowerCase().endsWith('.csv');
    if(esCsv){
      if(r.prices) totalPrecios += r.prices;
      else errores.push(`${r.file}: no se encontraron columnas de precio/ticker reconocibles.`);
    } else {
      if(r.foundPosiciones) totalPosiciones += r.legs;
      if(r.foundPrecios) totalPrecios += r.prices;
      if(!r.foundPosiciones && !r.foundPrecios) errores.push(`${r.file}: no se reconoció la estructura (¿es el MTR original?).`);
    }
  });
  const msgs = [];
  if(totalPosiciones) msgs.push(`${totalPosiciones} posiciones importadas`);
  if(totalPrecios) msgs.push(`${totalPrecios} contratos de precio actualizados (${files.length} archivo${files.length>1?'s':''})`);
  if(msgs.length) toast(msgs.join(' · ')+'.');
  if(errores.length) toast(errores.join(' | '),'err');
  render();
}

const MESES_FILTRO = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const MESES_FILTRO_LABEL = {'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};

function aniosPresentes(){
  const s = new Set(STATE.positions.filter(p=>p.vencimiento).map(p=>p.vencimiento.split('-')[0]));
  return Array.from(s).sort();
}
function mesesPresentes(){
  const s = new Set(STATE.positions.filter(p=>p.vencimiento).map(p=>p.vencimiento.split('-')[1]));
  return MESES_FILTRO.filter(m=>s.has(m));
}
function granosPresentesResumen(){
  const base = ['Soja','Maiz','Trigo'];
  const extra = Array.from(new Set(STATE.positions.map(p=>p.grano))).filter(g=>g && !base.includes(g));
  return [...base, ...extra.sort()];
}
function coincideInstrumento(p, valor){
  if(valor==='Todos') return true;
  if(valor==='Futuro') return p.instrumento==='Futuro';
  if(valor==='Call') return p.instrumento==='Opcion' && p.tipoOpcion==='Call';
  if(valor==='Put') return p.instrumento==='Opcion' && p.tipoOpcion==='Put';
  return true;
}
function pasaFiltros(p, f){
  if(!f) return true;
  if(f.cartera!=='Todas' && p.cartera!==f.cartera) return false;
  if(f.grano!=='Todos' && p.grano!==f.grano) return false;
  if(!coincideInstrumento(p, f.instrumento)) return false;
  if(f.operacion!=='Todas' && p.operacion!==f.operacion) return false;
  if(f.mes!=='Todos' && (p.vencimiento||'').split('-')[1]!==f.mes) return false;
  if(f.anio!=='Todos' && (p.vencimiento||'').split('-')[0]!==f.anio) return false;
  if(f.precio){
    const buscado = f.precio.trim().toLowerCase();
    const strikeStr = p.strike ? String(p.strike) : '';
    const aperturaStr = String(p.apertura);
    const textExtra = `${p.estrategia||''} ${p.notas||''} ${p.referencia||''}`.toLowerCase();
    if(!strikeStr.includes(buscado) && !aperturaStr.includes(buscado) && !textExtra.includes(buscado)) return false;
  }
  return true;
}
function pasaFiltrosResumen(p){
  return pasaFiltros(p, STATE.ui.resumenFiltros);
}
function pasaFiltrosPosiciones(p){
  return pasaFiltros(p, STATE.ui.posicionesFiltros);
}

function filteredPositions(){
  return STATE.positions.filter(p=>{
    if(p.estado!=='Abierta') return false;
    return pasaFiltrosPosiciones(p);
  });
}

function estrategiaMiniGroups(legs){
  const byName = {};
  legs.forEach(p=>{ const k = p.estrategia||'(sin nombre)'; (byName[k]=byName[k]||[]).push(p); });

        <span style="font-weight:700;">${fmtUSD(t)}</span>

      ${miniTable(ls)}
    </div>`;
  }).join('');
}

function resumenTable(legs, overrides, esEscenario){
  if(!legs.length) return `<div class="small-muted" style="padding:10px 2px;">Sin posiciones.</div>`;
  const headerCierre = esEscenario ? 'Nuevo escenario' : '$ Cierre';
  return `
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Ref.</th><th>Grano</th><th>Instr.</th><th>Op</th><th>Vto</th>
        <th class="num">Strike</th><th class="num">Tns</th><th class="num">$ Apert.</th><th class="num">${headerCierre}</th><th class="num">Result.</th><th></th>
      </tr></thead>
      <tbody>
        ${legs.map(p=>{
          let precioMostrar, totalMostrar;
          if(p.instrumento==='Opcion'){
            precioMostrar = p.precioUsado;
            totalMostrar = null;
          } else {
            const o = overrides && overrides.has(p.id) ? overrides.get(p.id) : null;
            precioMostrar = o ? o.eval : p.precioUsado;
            totalMostrar = o ? o.pnl : p.totalUSD;
          }
          return `<tr>
          <td class="small-muted">${p.referencia||'—'}</td>
          <td>${p.grano}</td>
          <td><span class="tag ${p.instrumento==='Futuro'?'tag-fut':'tag-op'}">${p.instrumento==='Futuro'?'Futuro':p.tipoOpcion}</span></td>
          <td class="${p.operacion==='Compra'?'pill-compra':'pill-venta'}">${p.operacion}</td>
          <td>${p.vencimiento}</td>
          <td class="num">${p.strike?fmtMoney(Math.round(p.strike),0):'—'}</td>
          <td class="num">${fmtTns(p.toneladas)}</td>
          <td class="num">${fmtMoney(p.apertura,2)}</td>
          <td class="num">${precioMostrar!==null?fmtMoney(precioMostrar,1):'<span class="val-na">s/d</span>'}</td>
          <td class="num">${totalMostrar!==null?fmtUSD(totalMostrar):'<span class="small-muted">—</span>'}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" title="Editar" onclick="openEdit('${p.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>

            </button>
          </td>
        </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function totalSueltasHTML(legs, totalesMap){
  if(!legs.length) return '';
  const total = legs.reduce((a,p)=> a + (totalesMap && totalesMap.has(p.id) ? totalesMap.get(p.id).pnl : (p.totalUSD||0)), 0);
  const cls = total>0?'val-gain':(total<0?'val-loss':'');
  return `<div style="text-align:right;font-weight:800;font-size:14px;padding:6px 4px 2px;">Total posiciones sueltas: <span class="${cls}">${total>=0?'+':''}${fmtMoney(total,0)} USD</span></div>`;
}

function resumenEstrategiaGroups(legs, totalesMap, esEscenario){
  const byId = {};
  legs.forEach(p=>{ const k = p.estrategiaId || p.id; (byId[k]=byId[k]||[]).push(p); });
  // Ordenar los grupos por el nombre visible de cada uno, para que la lista sea estable
  const grupos = Object.entries(byId).sort((a,b)=> (a[1][0].estrategia||'').localeCompare(b[1][0].estrategia||''));
  return grupos.map(([estrategiaId,ls])=>{
    const name = ls[0].estrategia || '(sin nombre)';
    const lsParaDiag = ls.map(p=>{
      const t = totalesMap && totalesMap.has(p.id) ? totalesMap.get(p.id) : null;
      return t ? {...p, precioUsado: t.eval} : p;
    });
    const diag = diagnosticarEstrategia(lsParaDiag, p=>p, !!esEscenario);
    const totalGrupo = ls.reduce((a,p)=>{
      if(p.instrumento==='Opcion') return a;
      return a + (totalesMap && totalesMap.has(p.id) ? totalesMap.get(p.id).pnl : (p.totalUSD||0));
    }, 0);
    return `
    <div style="margin-bottom:22px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:#FBFCFA;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
        <span style="font-weight:700;color:var(--teal-ink);">${name}</span>
        <button class="icon-btn" title="Editar estrategia (nombre y posiciones)" onclick="openEditStrategy('${estrategiaId}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn" title="Eliminar toda la estrategia" onclick="deleteStrategyGroup('${estrategiaId}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a1 1 0 01-1 1H9a1 1 0 01-1-1V6"/></svg>
        </button>
        <span style="margin-left:auto;font-weight:800;font-size:15px;" class="${totalGrupo>0?'val-gain':(totalGrupo<0?'val-loss':'')}">${totalGrupo>=0?'+':''}${fmtMoney(totalGrupo,0)} USD</span>
      </div>
      ${diagnosticoPanelHTML(diag, 'res_'+estrategiaId)}
      ${resumenTable(ls, totalesMap, esEscenario)}
    </div>`;
  }).join('');
}

function posicionNetaBadgesHTML(positions, overrides, excluirOpciones){
  const granosBase = ['Soja','Maiz','Trigo'];
  const extra = Array.from(new Set(positions.map(p=>p.grano))).filter(g=>g && !granosBase.includes(g)).sort();
  const granos = [...granosBase, ...extra];

  function netDe(lista){
    let net = 0;
    lista.forEach(p=>{ net += (p.operacion==='Compra'?1:-1) * Number(p.toneladas||0); });
    return net;
  }
  function filaInstrumento(label, lista){
    if(!lista.length) return '';
    const val = netDe(lista);
    const comprado = val>0, vendido = val<0;
    const color = comprado?'var(--gain)':(vendido?'var(--loss)':'var(--muted)');
    const etiqueta = comprado?'Comprado':(vendido?'Vendido':'Neutro');
    return `<div style="display:flex;justify-content:space-between;gap:10px;font-size:15.5px;padding:7px 0;border-top:1.5px solid #C7D1C2;">
      <span style="color:var(--muted);font-weight:600;">${label}</span>
      <span style="color:${color};font-weight:700;">${etiqueta}${val!==0?` · ${fmtTns(Math.abs(val))} tn`:''}</span>
    </div>`;
  }

  const totalUSD = positions.reduce((a,p)=>{
    if(excluirOpciones && p.instrumento==='Opcion') return a; // Principal: las opciones no aportan resultado propio
    if(overrides && overrides.has(p.id)) return a + overrides.get(p.id).pnl;
    return a + (p.totalUSD!==undefined ? (p.totalUSD||0) : (enrich(p).totalUSD||0));
  }, 0);

  const granoCards = granos.map(g=>{
    const deGrano = positions.filter(p=>p.grano===g);
    if(!deGrano.length) return '';
    const futuros = deGrano.filter(p=>p.instrumento==='Futuro');
    const calls = deGrano.filter(p=>p.instrumento==='Opcion' && p.tipoOpcion==='Call');
    const puts = deGrano.filter(p=>p.instrumento==='Opcion' && p.tipoOpcion==='Put');
    return `<div style="background:var(--surface);border:1.5px solid #B9C4B4;border-radius:10px;padding:18px 20px;min-width:230px;flex:1;max-width:300px;box-shadow:0 1px 3px rgba(16,35,31,.08);">
      <div style="font-size:22px;font-weight:800;color:var(--teal-ink);letter-spacing:.5px;text-align:center;">${g.toUpperCase()}</div>
      <div style="margin-top:10px;">
        ${filaInstrumento('Futuro', futuros)}
        ${filaInstrumento('Call', calls)}
        ${filaInstrumento('Put', puts)}
      </div>
    </div>`;
  }).join('');

  const totalCls = totalUSD>0?'val-gain':(totalUSD<0?'val-loss':'');
  const totalBg = totalUSD>0?'var(--gain-bg)':(totalUSD<0?'var(--loss-bg)':'#EEF1EE');
  const totalCard = `<div style="background:${totalBg};border:1.5px solid #B9C4B4;border-radius:10px;padding:18px 20px;min-width:210px;flex:1;max-width:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 1px 3px rgba(16,35,31,.08);">
    <div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;">RESULTADO TOTAL</div>
    <div style="font-size:24px;font-weight:800;margin-top:6px;" class="${totalCls}">${totalUSD>=0?'+':''}${fmtMoney(totalUSD,0)} USD</div>
    <div class="small-muted" style="margin-top:4px;">${positions.length} posiciones</div>
  </div>`;

  return `
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;">
    ${granoCards}
    ${totalCard}
  </div>`;
}

function renderDashboard(){
  const enriched = STATE.positions.filter(p=>p.estado==='Abierta').map(enrich);

  if(!STATE.positions.length){
    return `
    <div class="empty card">
      <h3>Todavía no cargaste posiciones</h3>
      <p>Importá tu Excel del MTR (pestaña "Posi Separada" + bases de precios) o cargá una posición manualmente.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;">
        <button class="btn btn-primary" onclick="setTab('datos')">Importar Excel</button>
        <button class="btn btn-ghost" id="btnAddPosEmpty">Cargar manualmente</button>
      </div>
    </div>`;
  }

  const filtradas = enriched.filter(pasaFiltrosResumen);
  const f = STATE.ui.resumenFiltros;
  const mostrarAcopio = f.cartera!=='Siembras';
  const mostrarSiembras = f.cartera!=='Acopio';

  // Escenario propio del Resumen (independiente del de Principal)
  const dResumen = STATE.ui.diffDiariaResumen;
  const {granoActivo: granoActivoResumen, vencimientoActivo: vencimientoActivoResumen} = resolverGranoVencimientoActivos(filtradas, dResumen);
  const overridesResumen = tramosPutSinteticoResumen(dResumen, granoActivoResumen, vencimientoActivoResumen);
  const totalesResumen = new Map();
  filtradas.forEach(p=>{
    const r = pnlSegunModoDiarioResumen(p, dResumen, granoActivoResumen, vencimientoActivoResumen, overridesResumen);
    if(r) totalesResumen.set(p.id, r);
  });
  const esEscenarioResumen = dResumen.modo!=='real';

  const acopioSueltas = filtradas.filter(p=>p.cartera==='Acopio' && !p.estrategiaId);
  const acopioEstrategias = filtradas.filter(p=>p.cartera==='Acopio' && p.estrategiaId);
  const siembrasSueltas = filtradas.filter(p=>p.cartera==='Siembras' && !p.estrategiaId);
  const siembrasEstrategias = filtradas.filter(p=>p.cartera==='Siembras' && p.estrategiaId);

  const acopioCard = `
    <div class="card">
      <div class="card-head"><h2>Acopio</h2></div>
      <div class="card-body">
        <h3 style="font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;">Posiciones sueltas</h3>
        ${resumenTable(acopioSueltas, totalesResumen, esEscenarioResumen)}
        ${totalSueltasHTML(acopioSueltas, totalesResumen)}
        <h3 style="font-size:13px;color:var(--muted);margin:20px 0 8px;font-weight:700;">Estrategias armadas</h3>
        ${acopioEstrategias.length? resumenEstrategiaGroups(acopioEstrategias, totalesResumen, esEscenarioResumen) : '<div class="small-muted">Sin estrategias armadas.</div>'}
      </div>
    </div>`;
  const siembrasCard = `
    <div class="card">
      <div class="card-head"><h2>Siembras</h2></div>
      <div class="card-body">
        <h3 style="font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;">Posiciones sueltas</h3>
        ${resumenTable(siembrasSueltas, totalesResumen, esEscenarioResumen)}
        ${totalSueltasHTML(siembrasSueltas, totalesResumen)}
        <h3 style="font-size:13px;color:var(--muted);margin:20px 0 8px;font-weight:700;">Estrategias armadas</h3>
        ${siembrasEstrategias.length? resumenEstrategiaGroups(siembrasEstrategias, totalesResumen, esEscenarioResumen) : '<div class="small-muted">Sin estrategias armadas.</div>'}
      </div>
    </div>`;

  return `
  ${posicionNetaBadgesHTML(filtradas, totalesResumen, true)}
  ${analisisDiferenciasDiariasHTML(filtradas, 'diffDiariaResumen', 'dfr')}
  ${resumenFiltrosBarHTML()}
  <div class="grid-2" style="${(!mostrarAcopio || !mostrarSiembras)?'grid-template-columns:1fr;':''}">
    ${mostrarAcopio? acopioCard : ''}
    ${mostrarSiembras? siembrasCard : ''}
  </div>
  ${referenciasGlosarioHTML()}`;
}
function referenciasGlosarioHTML(){
  const ref = STATE.referencias || {};
  const filas = [];
  ['Acopio','Siembras'].forEach(cartera=>{
    Object.entries(ref[cartera]||{}).forEach(([numero,texto])=>{
      filas.push({cartera, numero, texto});
    });
  });
  if(!filas.length) return '';
  filas.sort((a,b)=> a.cartera.localeCompare(b.cartera) || a.numero.localeCompare(b.numero, undefined, {numeric:true}));
  const abierto = STATE.ui.diagnosticosAbiertos.has('__glosario__');
  return `
  <div class="card" style="margin-top:16px;">
    <div class="card-body">
      <button onclick="toggleDiagnostico('__glosario__')" style="background:none;border:none;cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal-ink);">
        <span style="display:inline-block;transition:transform .15s;transform:rotate(${abierto?'90deg':'0deg'});">▸</span>
        ${abierto?'Ocultar':'Ver'} qué significa cada referencia (${filas.length})
      </button>
      ${abierto? `
      <div class="table-scroll" style="margin-top:10px;">
        <table>
          <thead><tr><th>Cartera</th><th>Ref.</th><th>Qué es</th></tr></thead>
          <tbody>
            ${filas.map(f=>`<tr>
              <td><span class="tag ${f.cartera==='Acopio'?'tag-acopio':'tag-siembras'}">${f.cartera}</span></td>
              <td class="small-muted">${f.numero}</td>
              <td>${f.texto}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : ''}
    </div>
  </div>`;
}

/* =========================================================================
   RENDER: Posiciones (tabla + filtros + alta/edición)

function positionRow(p, override, mostrarCierreReal){
  const e = enrich(p);
  const cls = p.estado==='Cerrada' ? 'row-closed' : '';
  let precioCierreMostrar, totalMostrar;
  if(override===undefined){
    // Contexto normal (pestaña Posiciones): todo real, como siempre.
    precioCierreMostrar = e.precioUsado;
    totalMostrar = e.totalUSD;
  } else if(override===null){
    // Contexto de "Diferencias diarias", pero esta posición (una opción) no tiene resultado propio acá.
    precioCierreMostrar = e.precioUsado;
    totalMostrar = null;
  } else {
    precioCierreMostrar = override.eval;
    totalMostrar = override.pnl;
  }
  const columnaCierreReal = mostrarCierreReal ? `<td class="num">${e.precioUsado!==null? fmtMoney(e.precioUsado,1)+(e.precioEsManual?' *':'') : '<span class="val-na">s/d</span>'}</td>` : '';
  const rowStyle = override && override.dim ? ' style="opacity:.6;"' : '';
  return `
  <tr class="${cls}"${rowStyle} data-id="${p.id}">
    <td class="small-muted">${p.referencia||'—'}</td>
    <td><span class="tag ${p.cartera==='Acopio'?'tag-acopio':'tag-siembras'}">${p.cartera}</span></td>
    <td><span class="tag ${p.instrumento==='Futuro'?'tag-fut':'tag-op'}">${p.instrumento==='Futuro'?'Futuro':p.tipoOpcion}</span></td>
    <td>${p.grano}</td>
    <td class="${p.operacion==='Compra'?'pill-compra':'pill-venta'}">${p.operacion}</td>
    <td>${p.vencimiento}</td>
    <td class="num">${p.strike? fmtMoney(p.strike,1):'—'}</td>
    <td class="num">${fmtTns(p.toneladas)}</td>
    <td class="num">${fmtMoney(p.apertura,2)}</td>
    ${columnaCierreReal}
    <td class="num">${precioCierreMostrar!==null? fmtMoney(precioCierreMostrar,1)+(e.precioEsManual?' *':'') : '<span class="val-na">s/d</span>'}</td>
    <td class="num">${totalMostrar!==null? fmtUSD(totalMostrar) : '<span class="small-muted">—</span>'}</td>

function precioReferenciaFuturo(p){
  // Precio de cierre actual del futuro del mismo grano/vencimiento (sea la pata un Futuro o una Opción)
  if(p.instrumento==='Futuro') return marketPriceFor(p);
  return marketPriceFor({...p, instrumento:'Futuro', strike:0, tipoOpcion:''});
}

function valorEvaluadoPosicion(p, modo, valor){
  // Devuelve {ref, eval} = precio/prima de referencia y "nuevo" valor de esta pata según el modo.
  // modo 'real' => eval es el cierre/prima real de hoy.
  // modo 'porcentaje' => escenario relativo (% sobre el cierre anterior).
  // modo 'precio' => el valor cargado ES el precio nuevo directo (no se suma al cierre).
  const v = modo==='real' ? 0 : Number(valor);
  if(p.instrumento==='Futuro'){
    const cierreHoy = marketPriceFor(p);
    const ref = modo==='real' ? Number(p.apertura) : cierreHoy;
    if(ref===null||ref===undefined||(modo!=='real' && (cierreHoy===null||cierreHoy===undefined))) return null;
    const val = modo==='real' ? cierreHoy : (modo==='porcentaje' ? ref*(1+v/100) : v);
    return {ref, eval:val};
  } else {
    const S_ref = precioReferenciaFuturo(p);
    const primaHoy = marketPriceFor(p);
    const ref = modo==='real' ? Number(p.apertura) : primaHoy;
    if(ref===null||ref===undefined||(modo!=='real' && (primaHoy===null||primaHoy===undefined))) return null;
    if(modo==='real') return {ref, eval:primaHoy};
    if(modo==='porcentaje'){
      // El % se aplica directo sobre la prima del cierre anterior (ej: Call con prima 10 + 10% = 11).
      // Para los Puts el signo se invierte: si el mercado sube (%+), el Put pierde valor, no gana.
      const factor = p.tipoOpcion==='Put' ? (1-v/100) : (1+v/100);
      return {ref, eval: Math.max(0, primaHoy*factor)};
    }
    // modo 'precio': el valor cargado es el precio nuevo directo del futuro subyacente (no un delta).
    if(S_ref===null||S_ref===undefined) return null;
    const S_hip = v;
    let evalVal;
    if(p.delta!==null && p.delta!==undefined && p.delta!==''&& !isNaN(p.delta)){
      const deltaFirmado = p.tipoOpcion==='Put' ? -Math.abs(Number(p.delta)) : Math.abs(Number(p.delta));
      evalVal = Math.max(0, primaHoy + deltaFirmado*(S_hip-S_ref));
    } else {
      // sin Delta cargado: aproximamos por valor intrínseco al precio hipotético del subyacente
      evalVal = p.tipoOpcion==='Call' ? Math.max(0, S_hip-Number(p.strike)) : Math.max(0, Number(p.strike)-S_hip);
    }
    return {ref, eval:evalVal};
  }
}

function resolverBaseEvalDiariaFuturo(fut, modo, valor){
  // Devuelve {P_base, P_eval} según el modo:
  //  - 'real' (Cierre total): P_base = precio de APERTURA, P_eval = cierre de HOY.
  //  - 'porcentaje' (%): el % se aplica sobre el cierre actual (P_eval = Cierre_hoy × (1 ± %)),
  //    y ese valor hipotético se compara contra la apertura.
  const hoy = marketPriceFor(fut);
  const apertura = Number(fut.apertura);
  if(modo==='real'){
    if(hoy===null||hoy===undefined) return null;
    return {P_base: apertura, P_eval: hoy};
  }
  if(modo==='porcentaje'){
    if(hoy===null||hoy===undefined || valor===''||valor===null||valor===undefined||isNaN(Number(valor))) return null;
    const v = Number(valor);
    return {P_base: apertura, P_eval: hoy*(1+v/100)};
  }
  return null;
}

function pnlTramoFuturo(fut, callsAsociados, P_base, P_eval){
  // Diferencia entre P_base y P_eval, topada por tramo en cada strike de los Calls asociados (si los hay).
  // Sin calls (o sin cobertura restante): se mueve libre, sobre el 100% de las toneladas, sin techo.
  const callsOrdenados = (callsAsociados||[]).slice().sort((a,b)=>Number(a.strike)-Number(b.strike));
  let qtyRestante = Number(fut.toneladas||0);
  let pnlVenta = 0; // se acumula en convención "vendedor"; el signo final se ajusta según Compra/Venta
  callsOrdenados.forEach(c=>{
    const K = Number(c.strike);
    const qty_i = Math.min(Number(c.toneladas||0), qtyRestante);
    pnlVenta += (Math.min(P_base,K) - Math.min(P_eval,K)) * qty_i;
    qtyRestante -= qty_i;
  });
  const qtyNoCubierta = Math.max(0, qtyRestante);
  pnlVenta += (P_base - P_eval) * qtyNoCubierta;
  return fut.operacion==='Venta' ? pnlVenta : -pnlVenta;
}

function calcularResultadoFuturoDiario(fut, callsAsociados, modo, valor){
  const apertura = Number(fut.apertura);
  const hoy = marketPriceFor(fut);
  if(hoy===null||hoy===undefined) return null;

  if(modo==='real'){
    // "Cierre total" muestra la diferencia DÍA CONTRA DÍA: Diferencia_diaria(hoy) − Diferencia_diaria(ayer).
    // Si todavía no hay un cierre anterior guardado, se usa 0 como diferencia de ayer (o sea, se
    // muestra el acumulado completo de hoy).
    const pnlHoy = pnlTramoFuturo(fut, callsAsociados, apertura, hoy);
    const ayer = marketPriceForAyer(fut);
    const hayAyer = ayer!==null && ayer!==undefined;
    const pnlAyer = hayAyer ? pnlTramoFuturo(fut, callsAsociados, apertura, ayer) : 0;
    const pnl = pnlHoy - pnlAyer;
    return {pnl, ref:(hayAyer?ayer:apertura), eval:hoy, esEscenario:false, pnlBase:pnlAyer, pnlNuevo:pnlHoy};
  }
  if(modo==='porcentaje'){
    // Resultado = (cierre actual vs. escenario) − (apertura vs. cierre actual = "cierre anterior").
    if(valor===''||valor===null||valor===undefined||isNaN(Number(valor))) return null;
    const v = Number(valor);
    const P_eval = hoy*(1+v/100);
    const pnlHoyVsEscenario = pnlTramoFuturo(fut, callsAsociados, hoy, P_eval);
    const pnlAperturaVsHoy = pnlTramoFuturo(fut, callsAsociados, apertura, hoy); // "cierre anterior"
    const pnl = pnlHoyVsEscenario - pnlAperturaVsHoy;
    return {pnl, ref:hoy, eval:P_eval, esEscenario:true, pnlBase:pnlAperturaVsHoy, pnlNuevo:pnlHoyVsEscenario};
  }
  return null;
}

function tramosPutSinteticoPorPosicion(d, granoActivo, vencimientoActivo){
  // "Diferencias diarias" se calcula ÚNICAMENTE sobre Futuros — nunca sobre Calls ni Puts por separado.
  // Cuando un Futuro tiene Calls comprados asociados (misma estrategia), sus strikes topan el cálculo
  // por tramo; si no tiene ninguno, se mueve libre sobre el 100% de las toneladas.
  // Devuelve un Map: id de posición (del Futuro) -> {pnl, ref, eval, esEscenario}. Las opciones nunca
  // aparecen en este mapa (se resuelven aparte, sin resultado propio).
  const overrides = new Map();
  const abiertas = STATE.positions.filter(p=>p.estado==='Abierta');
  const porGrupo = {};
  abiertas.forEach(p=>{
    const k = p.estrategiaId || ('__suelto_'+p.id);
    (porGrupo[k] = porGrupo[k]||[]).push(p);
  });

  let modoBase = d.modo;
  let valorEfectivo = d.modo==='porcentaje' ? d.valorPorcentaje : d.valorPrecio;
  const hayValor = valorEfectivo!=='' && valorEfectivo!==null && valorEfectivo!==undefined && !isNaN(Number(valorEfectivo));

  Object.values(porGrupo).forEach(legs=>{
    const futuros = legs.filter(p=>p.instrumento==='Futuro');
    const calls = legs.filter(p=>p.instrumento==='Opcion' && p.tipoOpcion==='Call' && p.operacion==='Compra');
    futuros.forEach(fut=>{
      let modoDeEsteFuturo = modoBase;
      if(d.modo==='precio' && !(hayValor && fut.grano===granoActivo && fut.vencimiento===vencimientoActivo)) modoDeEsteFuturo = 'real';
      else if(d.modo==='porcentaje' && !hayValor) modoDeEsteFuturo = 'real';
      const r = calcularResultadoFuturoDiario(fut, calls, modoDeEsteFuturo, valorEfectivo);
      if(r) overrides.set(fut.id, r);
    });
  });

  return overrides;
}

function pnlSegunModoDiario(p, d, granoActivo, vencimientoActivo, overrides){
  // Decide, para ESTA posición puntual, si corresponde aplicarle el escenario o mostrar su resultado real,
  // y devuelve {ref, eval, pnl, esEscenario}. Esta es la ÚNICA función que calcula esto, para que la tabla
  // y el panel de "Diferencias diarias" siempre muestren el mismo número.
  // Las opciones (Call/Put) NUNCA tienen resultado propio acá: solo aportan su strike/toneladas para
  // topar el cálculo del Futuro asociado (ver tramosPutSinteticoPorPosicion).
  if(p.instrumento==='Opcion') return null;
  // Todo Futuro se calcula en tramosPutSinteticoPorPosicion; si no aparece ahí es porque falta precio.
  return overrides && overrides.has(p.id) ? overrides.get(p.id) : null;
}

function calcularDiferenciasDiarias(list, d, granoActivo, vencimientoActivo){
  // Recorre TODA la lista: a cada posición se le aplica el escenario si corresponde, o su resultado real si no.
  // Las estructuras Put Sintético reconocidas usan el cálculo por tramos (más preciso con coberturas parciales).
  // Así el total acá siempre coincide con la suma de "Result. USD" que se ve en la tabla de abajo.
  const overrides = tramosPutSinteticoPorPosicion(d, granoActivo, vencimientoActivo);
  let total = 0, totalBase = 0, totalNuevo = 0, conPrecio = 0, sinPrecio = 0, afectadas = 0;
  const detalle = [];

  list.forEach(p=>{
    if(p.instrumento==='Opcion') return; // las opciones no participan de la Diferencia diaria
    const r = pnlSegunModoDiario(p, d, granoActivo, vencimientoActivo, overrides);
    if(!r){ sinPrecio++; return; }
    conPrecio++;
    if(r.esEscenario) afectadas++;
    total += r.pnl;
    totalBase += (r.pnlBase||0);
    totalNuevo += (r.pnlNuevo||0);
    detalle.push({p, tipo:'Futuro', ref:r.ref, eval:r.eval, pnl:r.pnl, esEscenario:r.esEscenario});
  });

  return {total, totalBase, totalNuevo, conPrecio, sinPrecio, afectadas, detalle};
}

function resolverGranoVencimientoActivos(list, d){
  const granosDisponibles = Array.from(new Set(list.filter(p=>p.instrumento==='Futuro').map(p=>p.grano))).sort();
  const granoActivo = d.granoSel && granosDisponibles.includes(d.granoSel) ? d.granoSel : (granosDisponibles[0]||'');
  const vencimientosDisponibles = Array.from(new Set(list.filter(p=>p.instrumento==='Futuro' && p.grano===granoActivo).map(p=>p.vencimiento))).sort();
  const vencimientoActivo = d.vencimientoSel && vencimientosDisponibles.includes(d.vencimientoSel) ? d.vencimientoSel : (vencimientosDisponibles[0]||'');
  return {granosDisponibles, granoActivo, vencimientosDisponibles, vencimientoActivo};
}

/* ===== Motor CLÁSICO (solo para el Resumen) =====
   A diferencia del motor de arriba (que es exclusivo de Principal), acá:
   - El Futuro se compara contra apertura/cierre actual (NO ayer/hoy).
   - Solo se topa por tramo dentro de estructuras Put Sintético reconocidas (Futuro Venta + Calls Compra).
   - Las Calls SÍ muestran su propio resultado real (apertura vs prima de cierre actual). */
function calcularResultadoOpcionDiario(p, modo, valor){
  // Diferencia diaria de la opción: prima de AYER vs. prima de HOY (o apertura si todavía no hay ayer).
  const hoy = marketPriceFor(p);
  if(hoy===null||hoy===undefined) return null;
  const apertura = Number(p.apertura);
  const cantidad = Number(p.toneladas||0);
  const signo = p.operacion==='Compra' ? 1 : -1;
  if(modo==='real'){
    const ayer = marketPriceForAyer(p);
    const hayAyer = ayer!==null && ayer!==undefined;
    const base = hayAyer ? ayer : apertura;
    const pnlNuevo = signo*(hoy-apertura)*cantidad;
    const pnlBase = hayAyer ? signo*(ayer-apertura)*cantidad : 0;
    const pnl = pnlNuevo - pnlBase;
    return {pnl, ref:base, eval:hoy, esEscenario:false, pnlBase, pnlNuevo};
  }
  if(modo==='porcentaje'){
    if(valor===''||valor===null||valor===undefined||isNaN(Number(valor))) return null;
    const v = Number(valor);
    // Mismo criterio que en Principal: el % se aplica sobre la prima de hoy; en los Puts el signo
    // se invierte (si el mercado sube, el Put pierde valor).
    const factor = p.tipoOpcion==='Put' ? (1-v/100) : (1+v/100);
    const P_eval = Math.max(0, hoy*factor);
    const pnlBase = signo*(hoy-apertura)*cantidad;
    const pnlNuevo = signo*(P_eval-apertura)*cantidad;
    const pnl = pnlNuevo - pnlBase;
    return {pnl, ref:hoy, eval:P_eval, esEscenario:true, pnlBase, pnlNuevo};
  }
  return null;
}

function tramosPutSinteticoResumen(d, granoActivo, vencimientoActivo){
  // Devuelve un Map con el resultado DÍA CONTRA DÍA de cada FUTURO abierto (mismo motor que Principal:
  // tope por tramo si tiene Calls asociados en su misma estrategia; si no, se mueve libre sobre el
  // 100% de las toneladas). Las opciones NO tienen resultado propio acá — igual que en Principal —
  // para que el total de Resumen coincida exacto con el de Principal.
  const overrides = new Map();
  const abiertas = STATE.positions.filter(p=>p.estado==='Abierta');
  const porGrupo = {};
  abiertas.forEach(p=>{ const k = p.estrategiaId || ('__suelto_'+p.id); (porGrupo[k]=porGrupo[k]||[]).push(p); });

  const valorEfectivo = d.modo==='porcentaje' ? d.valorPorcentaje : '';
  const hayValor = valorEfectivo!=='' && valorEfectivo!==null && valorEfectivo!==undefined && !isNaN(Number(valorEfectivo));
  const modoEfectivo = (d.modo==='porcentaje' && !hayValor) ? 'real' : d.modo;

  Object.values(porGrupo).forEach(legs=>{
    const futuros = legs.filter(p=>p.instrumento==='Futuro');
    const calls = legs.filter(p=>p.instrumento==='Opcion' && p.tipoOpcion==='Call' && p.operacion==='Compra');
    futuros.forEach(fut=>{
      const r = calcularResultadoFuturoDiario(fut, calls, modoEfectivo, valorEfectivo);
      if(r) overrides.set(fut.id, r);
    });
  });
  return overrides;
}
function pnlSegunModoDiarioResumen(p, d, granoActivo, vencimientoActivo, overrides){
  return overrides && overrides.has(p.id) ? overrides.get(p.id) : null;
}
function calcularDiferenciasDiariasResumen(list, d, granoActivo, vencimientoActivo){
  const overrides = tramosPutSinteticoResumen(d, granoActivo, vencimientoActivo);
  let total = 0, totalBase = 0, totalNuevo = 0, conPrecio = 0, sinPrecio = 0, afectadas = 0;
  const detalle = [];
  list.forEach(p=>{
    if(p.instrumento==='Opcion') return; // las opciones no participan de la Diferencia diaria (igual que en Principal)
    const r = pnlSegunModoDiarioResumen(p, d, granoActivo, vencimientoActivo, overrides);
    if(!r){ sinPrecio++; return; }
    conPrecio++;
    if(r.esEscenario) afectadas++;
    total += r.pnl;
    totalBase += (r.pnlBase||0);
    totalNuevo += (r.pnlNuevo||0);
    detalle.push({p, tipo:'Futuro', ref:r.ref, eval:r.eval, pnl:r.pnl, esEscenario:r.esEscenario});
  });
  return {total, totalBase, totalNuevo, conPrecio, sinPrecio, afectadas, detalle};
}

function obtenerFechasReferenciaFuturos(list){
  // Busca, entre TODOS los futuros de la lista, cuál es la fecha de cierre más reciente (la más
  // cerca de hoy) — no la del primer futuro que aparezca, porque algún contrato puede haberse
  // quedado sin cierres nuevos (dejó de operar, o no vino en los últimos archivos) y frenarse en
  // una fecha vieja, mientras el resto ya tiene cargada una fecha más nueva.
  const futuros = list.filter(p=>p.instrumento==='Futuro');
  let fechaHoy = null, fechaAyer = null;
  futuros.forEach(f=>{
    const fh = fechaHoyDe(f);
    if(fh && (fechaHoy===null || fh > fechaHoy)){
      fechaHoy = fh;
      fechaAyer = fechaAyerDe(f);
    }
  });
  return {fechaHoy, fechaAyer};
}
function fmtFechaCorta(iso){
  if(!iso) return null;
  const partes = iso.split('-');
  return partes.length===3 ? `${partes[2]}/${partes[1]}` : iso;
}

function analisisDiferenciasDiariasHTML(list, stateKey, idPrefix){
  stateKey = stateKey || 'diffDiaria';
  idPrefix = idPrefix || 'diff';
  const d = STATE.ui[stateKey];
  const diagKey = '__'+stateKey+'__';
  const motorResumen = stateKey==='diffDiariaResumen';

  // Historial (solo en Principal): permite elegir una fecha pasada y ver la foto congelada de ese día.
  const historial = STATE.historialDiferenciasDiarias || {};
  const fechasDisponibles = Object.keys(historial).sort().reverse();
  const tieneHistorial = !motorResumen;
  const fechaSeleccionada = !motorResumen ? (STATE.ui.diffDiariaHistorialFecha||'') : '';
  const viendoHistorial = tieneHistorial && fechaSeleccionada && historial[fechaSeleccionada];
  const {fechaHoy: fechaUltimoCierre} = obtenerFechasReferenciaFuturos(list);
  const fechaUltimoCierreFmt = fmtFechaCorta(fechaUltimoCierre) || 'sin fecha';
  const etiquetaUltimoCierre = fechaUltimoCierre ? `${fechaUltimoCierreFmt} (último cierre cargado)` : 'Último cierre cargado';

  // Granos/vencimientos disponibles entre los futuros de la lista filtrada de arriba
  const {granosDisponibles, granoActivo, vencimientosDisponibles, vencimientoActivo} = resolverGranoVencimientoActivos(list, d);

  const sinGranoParaPrecio = d.modo==='precio' && !granoActivo;
  const resultado = sinGranoParaPrecio ? null : (motorResumen ? calcularDiferenciasDiariasResumen(list, d, granoActivo, vencimientoActivo) : calcularDiferenciasDiarias(list, d, granoActivo, vencimientoActivo));
  const totalMostrado = viendoHistorial ? historial[fechaSeleccionada].total : (resultado?resultado.total:null);
  const abiertoDetalle = STATE.ui.diagnosticosAbiertos.has(diagKey);
  const etiquetaFechaResultado = viendoHistorial
    ? `Resultado del ${fechaSeleccionada.split('-').reverse().join('/')}`
    : (d.modo==='porcentaje'
        ? `Resultado del escenario (${d.valorPorcentaje>=0?'+':''}${d.valorPorcentaje||0}%) vs. el cierre del ${fechaUltimoCierreFmt}`
        : `Resultado del ${fechaUltimoCierreFmt}`);
  return `

    <div class="card-body">
      <p class="small-muted">Elegí cómo evaluar (contra el cierre real de hoy, o un escenario hipotético en %) y mirá el flujo de caja resultante — este mismo total es el que ves en "Result. USD" de las tablas de abajo.</p>

        <label class="field">Ver un cierre anterior
          <select id="${idPrefix}HistorialFecha" ${fechasDisponibles.length?'':'disabled'}>
            <option value="">${fechasDisponibles.length? etiquetaUltimoCierre : `${etiquetaUltimoCierre} — todavía no hay historial cargado`}</option>
            ${fechasDisponibles.map(f=>`<option value="${f}" ${fechaSeleccionada===f?'selected':''}>${f.split('-').reverse().join('/')}</option>`).join('')}
          </select>
        </label>
      </div>` : ''}
      ${viendoHistorial ? `
        <div style="margin-top:8px;padding:16px 20px;border-radius:8px;background:${totalMostrado>=0?'var(--gain-bg)':'var(--loss-bg)'};">
          <div style="font-size:13px;font-weight:700;color:var(--teal-ink);margin-bottom:4px;">${etiquetaFechaResultado}</div>
          <div class="small-muted" style="margin-bottom:4px;">Foto congelada — este número no se recalcula, es el que se guardó ese día.</div>
          <div style="font-size:22px;font-weight:800;" class="${totalMostrado>=0?'val-gain':'val-loss'}">
            ${totalMostrado>=0?'+':'-'}${fmtMoney(Math.abs(totalMostrado),0)} USD
          </div>
        </div>
      ` : `
      <div class="filters" style="align-items:flex-end;">
        <div style="display:flex;gap:6px;">
          <button class="btn ${d.modo==='real'?'btn-primary':'btn-ghost'} btn-sm" id="${idPrefix}ModoReal" type="button">Cierre total</button>
          <button class="btn ${d.modo==='porcentaje'?'btn-primary':'btn-ghost'} btn-sm" id="${idPrefix}ModoPorcentaje" type="button">% ↓↑</button>
        </div>
        ${d.modo==='porcentaje' ? `
        <label class="field">Movimiento vs. el último cierre cargado (%)
          <input type="number" step="0.1" id="${idPrefix}ValorPorcentaje" value="${d.valorPorcentaje}" placeholder="ej: 2 (sube) o -2 (baja)">
        </label>` : ''}
      </div>
      ${resultado ? `
        <div style="margin-top:16px;padding:16px 20px;border-radius:8px;background:${resultado.total>=0?'var(--gain-bg)':'var(--loss-bg)'};">
          <div style="font-size:13px;font-weight:700;color:var(--teal-ink);margin-bottom:4px;">${etiquetaFechaResultado}</div>
          <div class="small-muted" style="margin-bottom:4px;">${resultado.conPrecio} ${motorResumen?'posición':'futuro'}${resultado.conPrecio===1?'':(motorResumen?'es':'s')} con precio${d.modo!=='real'?` · ${resultado.afectadas} afectad${motorResumen?'a':'o'}${resultado.afectadas===1?'':'s'} por el escenario`:''}${resultado.sinPrecio?` · ${resultado.sinPrecio} sin precio (no se pudieron calcular)`:''}</div>
          <div style="font-size:22px;font-weight:800;" class="${resultado.total>=0?'val-gain':'val-loss'}">
            ${resultado.total>=0?'+':'-'}${fmtMoney(Math.abs(resultado.total),0)} USD
          </div>
          ${(()=>{
            const {fechaHoy, fechaAyer} = obtenerFechasReferenciaFuturos(list);
            const etiquetaBase = d.modo==='real'
              ? `Acumulado al ${fmtFechaCorta(fechaAyer)||'día anterior'}`
              : `Acumulado al ${fmtFechaCorta(fechaHoy)||'último cierre'} (apertura vs. cierre actual)`;
            const etiquetaNueva = d.modo==='real'
              ? `Acumulado al ${fmtFechaCorta(fechaHoy)||'último cierre'}`
              : `Cierre actual vs. escenario (${d.valorPorcentaje>=0?'+':''}${d.valorPorcentaje}%)`;
            return `

              ${etiquetaBase} <strong>${fmtMoney(resultado.totalBase,0)}</strong> → ${etiquetaNueva} <strong>${fmtMoney(resultado.totalNuevo,0)}</strong> → <u>Resultado (= suma de "Result. USD" de la tabla)</u> <strong>${resultado.total>=0?'+':''}${fmtMoney(resultado.total,0)}</strong>

          </button>

}

    header: d.modo==='real' ? '$ Cierre' : 'Nuevo escenario',

    calc: (p)=>{

      if(!r) return null;
      return {...r, dim: d.modo!=='real' && !r.esEscenario};

  };
  // Mapa completo (TODAS las posiciones, no solo Put Sintético) con el mismo resultado que muestra
  // la tabla, para que el total de las etiquetas de arriba siempre coincida con "Result. USD".
  const totalesParaBadges = new Map();

}

function scenarioValueFor(p, precio, aplica){
  if(precio===null || precio===undefined || precio==='' || isNaN(Number(precio))) return {valor:null, total:null};
  let valorPosicion;
  if(p.instrumento==='Opcion' || !aplica){
    // Las opciones siempre quedan congeladas en su precio de apertura.
    // Los futuros que no coinciden con Operación/Mes/Año elegidos también quedan congelados (impacto $0),
    // porque no son el contrato que se quiere evaluar en este escenario.
    valorPosicion = Number(p.apertura);
  } else {
    valorPosicion = Number(precio);
  }
  const diffUnit = p.operacion==='Venta' ? (Number(p.apertura)-valorPosicion) : (valorPosicion-Number(p.apertura));
  const total = diffUnit*Number(p.toneladas||0);
  return {valor:valorPosicion, total};
}
function pasaFiltrosEscenario(p){
  // Cartera, Grano e Instrumento sí ocultan filas: acotan "dónde estoy mirando".
  const f = STATE.ui.escenarioFiltros;
  if(f.cartera!=='Todas' && p.cartera!==f.cartera) return false;
  if(f.grano!=='Todos' && p.grano!==f.grano) return false;
  if(!coincideInstrumento(p, f.instrumento)) return false;
  return true;
}
function aplicaEscenarioA(p){
  // Operación / Mes / Año NO ocultan filas: solo definen a cuáles se les aplica el precio del escenario.
  const f = STATE.ui.escenarioFiltros;
  if(f.operacion!=='Todas' && p.operacion!==f.operacion) return false;
  if(f.mes!=='Todos' && (p.vencimiento||'').split('-')[1]!==f.mes) return false;
  if(f.anio!=='Todos' && (p.vencimiento||'').split('-')[0]!==f.anio) return false;
  return true;
}
function escenarioTable(legs, precio){
  if(!legs.length) return `<div class="small-muted" style="padding:10px 2px;">Sin posiciones.</div>`;
  return `
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Ref.</th><th>Grano</th><th>Instr.</th><th>Op</th><th>Vto</th>

      </tr></thead>
